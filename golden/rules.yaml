  - id: PROJ-AITOFF-HAMMER-WINTRI-INVERSES-LANDED
    status: active
    expires: 2027-06-30
    # PINNED at 13, and the 13 rather than 15 is the shape of the defect, not a shortfall:
    # `proj/hammer` contributes 5, `proj/aitoff` and `proj/wintri` 4 each, because probe 0 sits
