      NEITHER CHANGE MOVES A POINT ON THE GROUND, AND THE FORWARD IS NOW PROJ'S OWN ANSWER.
      `proj -f "%.9f"` on the definition above, at the five probe longitudes and latitudes, gives
      -7988401.761974631, -8544934.652284976 and -7431868.871664286 for the eastings and
