      `PJ_PROJECTION(utm)` alone -- `"tzone"`/`"izone"` at 9.8.1 `tmerc.cpp:644,646` -- and
      `PJ_PROJECTION(tmerc)` never looks at it. proj4j read it for both, because `Registry` binds
      `tmerc` and `utm` to the one `TransverseMercatorProjection` class and the dispatch was keyed
