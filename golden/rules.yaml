  - id: PROJ-POLYCONIC-INVERSE-CONVERGES
    status: active
    expires: 2027-06-30
    # PINNED at 6 = five REG keys at probe 0 plus SYN proj/poly at probe 0. Probe 0 only, on
    # every one of the six, and that is the defect's own shape rather than a coincidence: see
    # the reason.
    # RE-PINNED 2026-08-01 by the FAILCLOSED-NAD27-OUTSIDE-GRID-REPORTED stream, which is
    # ordered first in this file. 2 of this rule's rows are +datum=NAD27 CRS whose transform
    # now raises COORDINATE_OUTSIDE_GRID instead of returning a coordinate, so they have no
    # numeric movement left for this rule to describe and that rule claims them. The mechanism
    # this rule states is unchanged and is still true of the 4 that remain; only the
    # population it applies to shrank. Verified on a frozen A/B, and the arithmetic is
    # itemised in that rule's reason.
    expected_rows: 4
    reason: |
      `EXC:InvalidValueException: inv: Infinite longitude` -> `OK` on
      `epsg:5472`, `esri:102766`, `esri:65061`, `esri:65161`, `nad27:5400` and `SYN proj/poly`.
      golden/README.md's second triage lists exactly these six and leaves them unexplained
      pending an owner; the owner has landed and the mechanism is in the source.

      THE DEFECT WAS A FACTOR OF 150 IN THE NEWTON DENOMINATOR.
      `proj/PolyconicProjection.projectInverse`'s ellipsoidal branch now reads

          // 9.8.1:poly.cpp:88 is one_es / (mlp^3), i.e. (1 - es); proj4j had
          // (1 / es), which for GRS80 is 149 -- off by a factor of 150.
          mlp = one_es / (mlp * mlp * mlp);

      `one_es` is `1 - es` = 0.99331 for GRS80 and `1/es` is 149.0, so the derivative term the
      iteration divides by was wrong by 150x and the iteration diverged instead of converging;
      the resulting non-finite longitude was then reported by a downstream finiteness test as
      `Infinite longitude`, i.e. as if the INPUT had been bad. It was not; the iteration was.

      WHY PROBE 0 AND ONLY PROBE 0, WHICH IS THE PART THAT MAKES THIS A MECHANISM RATHER THAN A
      ROW LIST. A diverging Newton iteration on the polyconic fails first where the correction
      term is largest relative to the seed, and for these six the probe-0 easting is the one
      that put `dPhi` outside the basin. The other four probes of each key converged in 1.4.3
      as well -- to the WRONG place, by 1.6 to 11.7 km -- and those rows are `OK -> OK` and are
      claimed by PROJ-POLYCONIC-KERNEL-CORRECTED immediately below, not here. One defect, two
      row shapes, two rules, because a single rule would need both a magnitude band and
      all-NaN endpoints and cannot have both.

      Both endpoints of these six rows are an exception on the baseline side, so there is no
      baseline number to absorb.
    match:
      classifications: [CHANGED]
      tgt_proj: [poly]
      status_from: "EXC:org.locationtech.proj4j.InvalidValueException"
      status_to: "OK"
    expect:
      dimensions: [fx, fy, fz, ix, iy, iz]
      allow_status_change: true
      allow_inside_change: true
      allow_nonfinite: true

