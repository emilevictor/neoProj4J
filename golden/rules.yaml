      m in `fx`/`fy` (metres -- the host projection for the `ellps/<name>` sweep is `merc`, a
      projected target), so the band is 1 .. 100 m: comfortably around what a 1.848 ppm scale can
      produce at these probes and comfortably below anything structural.

      Unambiguously intended, and one of the very few changes in this suite whose entire effect is a
      single scale factor.
    match:
