  - id: NUM-NWL9D-ANDRAE-POLE-RADIUS-TRANSPOSED
    status: active
    expires: 2027-06-30
    # PINNED at 10 = 2 ellipsoid names x 5 probes. Structural now; it was not before, and the
    # change from data-driven to structural is the whole story of this rule.
    #
    # RENAMED FROM NUM-PHI2-CONVERGES-ON-EXTREME-ELLIPSOIDS, WHOSE PREMISE WAS FALSE TWICE. That
    # rule said 1.4.3's 15-trip phi2 "ran out of trips" "on the two most eccentric entries of
    # `ellps.cpp`". NWL9D and andrae are not the two most eccentric entries of `ellps.cpp`; they
    # are entirely ordinary, at rf 298.25 and 300.0, giving e = 0.0818 and 0.0816 against GRS80's
    # 0.081819. Nothing in `ellps.cpp` was extreme. The extreme eccentricity was manufactured HERE:
    # `Registry.ellipsoids` re-declared both names with the inverse flattening in the `poleRadius`
    # slot -- `new Ellipsoid("NWL9D", 6378145.0, 298.25, 0.0, ...)` -- which selects the
    # `1 - (b*b)/(a*a)` branch of the constructor and takes 298.25 METRES literally as the polar
    # semi-axis. e came out 0.999999998906693. phi2 was being asked to invert a flat disc, and it
    # is to its credit that it only failed on six of the ten rows.
    #
    # AND THE SECOND FALSE CLAIM, WHICH IS WHY THE COUNT MOVED: "The split is 4 + 2 rather than
    # 5 + 5 because the other probes of those two keys converged in 1.4.3 too." They did not
    # converge in 1.4.3. Those four rows -- `ellps/NWL9D` probe 0 and `ellps/andrae` probes 0..2 --
    # were `EXC:ConvergenceFailureException` on BOTH sides, so they were not status changes and
    # NUM-KARNEY-LATITUDE-CORE claimed them as ordinary sub-ULP drift on `fy` alone. The
    # transposition fix is what turns them into `OK`. The two counts moved by the same four rows in
    # opposite directions, 6 -> 10 here and 19324 -> 19320 there, and that conservation is the
    # check that nothing else moved with them.
    #
    # THE MAGNITUDES ARE THE OTHER HALF OF THE PROOF, and they are the reason this could not stay a
    # re-pin. Under the old rule these six rows moved by 0x1.8c871adp-31 to 0x1.284492cp-29 -- one
    # to two nanometres, the signature of a numerical-core rewrite. They now move by 0x1.27p22 to
    # 0x1.87p22, 4.8 to 6.4 million metres. That is not phi2 converging better. That is the answer
    # arriving from a different ellipsoid, which is what a 6,356,760 m error in the polar
    # semi-axis buys.
    expected_rows: 10
    reason: |
      `SYN ellps/{NWL9D, andrae}`, all five probes each:
      `EXC:ConvergenceFailureException: inv: Computation of phi2 failed to converage after 15
      iterations` -> `OK`. (The baseline message's spelling is upstream-of-us and reproduced
      verbatim, as this suite reproduces every baseline string.)

      Two changes converge on these ten rows and both are needed to explain them.

      The first is `Registry.ellipsoids` no longer re-declaring NWL9D and andrae with the inverse
      flattening in the `poleRadius` slot. Both entries now reference the correct
      `Ellipsoid.NWL9D` and `Ellipsoid.ANDRAE`, which carry `rf` in the `rf` slot. Measured after
      the fix: NWL9D b = 6356759.769489, e = 0.081820179996060; andrae b = 6355847.415233,
      e = 0.081581588336803. Before it, both b values were the inverse flattening itself and both
      e values were 0.99999999890. Every transform through `+ellps=NWL9D` or `+ellps=andrae` was
      computed on a near-flat disc, in every release this library has ever made.

      The second is the phi2 rewrite that the old name credited with the whole effect. It is real
      and it is why four of these rows converge at all -- see NUM-KARNEY-LATITUDE-CORE, 4,145 nm
      -> 2.1 nm at GRS80 -- but on its own it fixed six rows and left four failing, and it never
      touched the figure of the ellipsoid. Naming the rule after it hid a wrong answer behind a
      right one for the length of a release.

      WHY THIS IS A SEPARATE RULE FROM NUM-KARNEY-LATITUDE-CORE, unchanged from the original and
      still correct: that rule refuses status changes and non-finite endpoints on purpose, so it
      cannot claim a row whose baseline side is an exception, and it should not be loosened to do
      so -- its whole value is that it can only absorb sub-microscopic drift. It is precisely
      because it refuses status changes that the four rows moved out of it on their own when the
      ellipsoid was fixed, which is how the transposition was caught.

      No magnitude band, for the reason the original gave and which still holds: the baseline side
      is all-NaN, so there is nothing to take a magnitude against. Scoped to the two keys because a
      convergence failure disappearing is exactly the kind of good news that should not silently
      license the next one.
    match:
      classifications: [CHANGED]
      sections: [SYN]
      keys: ["ellps/NWL9D", "ellps/andrae"]
      status_from: "EXC:org.locationtech.proj4j.ConvergenceFailureException"
      status_to: "OK"
    expect:
      dimensions: [fx, fy, fz, ix, iy, iz]
      allow_status_change: true
      allow_inside_change: true
      allow_nonfinite: true

  # ---------------------------------------------------------------------------------------------
  - id: PROJ-INVERSE-CORRECTED-ROUND-TRIP-NOW-EXACT
    status: active
    expires: 2027-06-30
    # PINNED at 48, measured 2026-08-01 on a frozen /tmp snapshot, across 11 keys:
    #   SYN proj/bipc 5 · collg 5 · fahey 5 · lsat 5 · euler 4 · murd1 4 · murd2 4 · murd3 4
    #   · pconic 4 · vitk1 4 · REG esri:54026 4
    # Data-driven, not structural: six keys contribute 4 rows and not 5 because their probe 0 sits
    # at the CRS origin, where the broken inverse happened to be right. `core/proj/**` is still
    # live, so this number is expected to move -- and that is the argument FOR the pin, not against
    # it. A projection stream that changes it gets a COUNT_MISMATCH naming this rule; a TBD would
    # have let the row set change size in silence.
    expected_rows: 48
    reason: |
      THE STRONGEST EVIDENCE THIS REGIME CAN PRODUCE SHORT OF A ROW RETURNING TO BASELINE, and the
      `expect.dimensions` clause is what makes it safe.

      Every claimed row moves ONLY in the inverse columns -- `dimensions: [ix, iy, iz]` -- so the
      forward output is bit-identical to 1.4.3 on all 48. A rule that cannot touch `fx`, `fy` or
      `fz` cannot hide a forward regression; if a future change moves a forward ordinate on any of
      these rows the rule DECLINES it and the row reappears as UNEXPLAINED. That is the entire
      reason this cluster can be ruled while its files are still being written.

      And what the inverse columns move TO is checkable rather than asserted: the committed probe
      coordinate, to nine digits. `probes.tsv` puts the canonical synthetic probes at longitude
      10 / -11.2132034 / 31.2132034 and latitude 45 / 30 / 60, and that is precisely what `ix`/`iy`
      now return. Before, they returned something else entirely:

        SYN proj/lsat   probe 0  ix 136.758446215 -> 10.000000230, iy -56.0683414 -> 45
                        probes 1 and 3 also recorded ix = 136.758446215 -- the SAME value at two
                        different probes, which is the tell: it is the +-pi longitude clamp, not a
                        coordinate. LandsatProjection.projectInverse was ENTIRELY INSIDE A BLOCK
                        COMMENT, so Projection.projectInverse's unconditional identity ran instead,
                        and Projection.inverseProjectRadians CLAMPED longitude to +-pi where
                        9.8.1 WRAPS with adjlon (src/inv.cpp, via pj_adjlon).
        SYN proj/collg  iy -31.0082524 -> 45,   -40.5142342 -> 30,   -20.9717108 -> 60
        SYN proj/fahey  iy  24.7638938 -> 45,    43.6824137 -> 30,    -5.90746223 -> 60
        SYN proj/euler  ix -167.926368 -> -11.2132034  (a 156-degree error)
        SYN proj/murd1  ix -165.517234 -> -11.2132034
        SYN proj/murd2, murd3, pconic, vitk1: the same shape, 149..168 degrees out
        SYN proj/bipc   ix  16.3737802 -> 10,    iy -20.6736053 -> 45
        REG esri:54026  ix 0 -> -5 and iy 0 -> -5 at a probe of (-5, -5): the inverse returned the
                        ORIGIN for all four corners, a sentinel wearing a coordinate's clothes.

      Six of the eleven keys are the `SimpleConicProjection` family (euler, murd1, murd2, murd3,
      pconic, vitk1) and their three shared defects; `lsat` is the Landsat/SOM fix above; `collg`,
      `fahey`, `bipc` and `esri:54026` are the `builtins` numerical batch.

      Note that four keys contribute 4 rows rather than 5, and the missing row is probe 0 in every
      case -- the CRS centre, where an inverse that is 156 degrees wrong in longitude still returns
      the right answer because the longitude offset from centre is zero. That asymmetry is a
      property of the defect and is why the count is data-driven; see the expected_rows note.

      Units: `ix`/`iy` are always WGS84 degrees (golden/README.md's units warning), so the
