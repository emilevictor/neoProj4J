  - id: DATUM-ISEQUAL-SELF-COMPARISON
    status: active
    expires: 2027-06-30
    # PINNED at 284, measured 2026-08-01 on a frozen /tmp snapshot, and corroborated independently
    # by FAILCLOSED-NAD27-OUTSIDE-GRID-REPORTED's reason, which predicts
    # "DATUM-ISEQUAL-SELF-COMPARISON 332 -> 284 (-48)". golden/README.md's 431 is two snapshots old.
    # This rule and DATUM-TYPE-UNKNOWN-HOISTED above are expected to move TOGETHER -- the hoist
    # decides whether isEqual is reached at all -- so a change in one count alone is itself a signal.
    # RE-PINNED 2026-08-01 by the GRIDS-EPSG-SHIP-CONUS stream: proj4j-epsg now ships PROJ
    # 9.8.1's `conus` at proj4/nad/conus, so the golden run resolves that grid for the first
    # time (golden depends on proj4j-epsg and, unlike core's own tests and the conformance
    # module, has no other copy on its classpath). Measured on a frozen /tmp A/B whose two
    # trees differ in exactly one byte-bearing file, the grid itself. +12 PAIR rows that previously threw on grid coverage now produce a coordinate, so they have
    # numeric movement for this rule to describe again.
    expected_rows: 296
    reason: |
      datum/Datum.java:437 isEqual now compares the two datums' equator radii, :454 reading
      `ellipsoid.getEquatorRadius() != datum.ellipsoid.getEquatorRadius()`. The comment at :450-453
      records what the BASELINE does, which is what these rows measure: the right-hand side named the
      SAME ellipsoid, so the condition was always false, the eccentricity guard below it was dead code,
      and unequal ellipsoids were declared equal -- which short-circuits the datum transform at
      BasicCoordinateTransform.java:565-566 and decides whether a datum shift happens at all. A second,
      residual divergence in the same method is STILL PRESENT in the working tree, unfixed:
      upstream pj_compare_datums is an OR (`if (a != a || fabs(es_a - es_b) > 5e-11) return 0;`) where
      Datum.java:454-458 nests the eccentricity check inside the radius check, so "radius differs,
      eccentricity within 5e-11" still compares equal.

      Scoped to the PAIR section, which exists precisely to exercise the 25 combinations of source and
      target Datum.TYPE_*. Two constraints keep this from being a blanket licence over 1,000 rows:
      allow_status_change is NOT set, so the 23 rows that turn from OK into
      java.lang.IllegalStateException stay UNEXPLAINED (a new non-Proj4jException escape is its own
      change and belongs to the fail-closed work, not here); and the magnitude is capped at 1e6, so a
      movement larger than 1,000 km / 1e6 degrees is not explained by a datum-comparison fix.
    match:
      classifications: [CHANGED]
      sections: [PAIR]
    expect:
      dimensions: [fx, fy, fz, ix, iy, iz]
      allow_nonfinite: true
      magnitude: {min: 0.0, max: 1.0e6}

