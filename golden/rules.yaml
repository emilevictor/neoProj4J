  - id: PARSE-R-DECLARES-SPHERE
    status: active
    expires: 2027-06-30
    # PINNED at 250, measured 2026-08-01 on a frozen /tmp snapshot, and it agrees with
    # golden/README.md's independently recorded 250. Structural: 9 `R*` modifier slugs are
    # enumerated in `keys` below and, at 5 probes over the hosts that move, they come to 250.
    # THE ENUMERATION IS LOAD-BEARING -- do not collapse it to "mod/*/R*". A glob would also swallow
