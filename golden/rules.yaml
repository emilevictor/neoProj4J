      BASELINE does, which is what these rows measure: it routed +R through Projection.setRadius,
      which sets `a` ONLY -- es, e and ellipsoid untouched -- and +R never reached DatumParameters at
      all. So in the baseline the ELLIPSOIDAL formula runs on a declared sphere: the easting is exact
      and the northing is wrong by ~1,495 m at latitude 2 and ~35,000 m at 55. PROJ's +R
      short-circuits the entire ellipsoid pipeline (size only, es = f = e = rf = 0, b = a) and ignores
      every shape and spherification parameter.

      Magnitude is unbounded because the affected rows span metres to tens of kilometres, and because
      the same tokens reach both projected targets (metres) and the longlat host (degrees). See the
      units warning at the top of this file.
    match:
