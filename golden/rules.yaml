        probe 1  (-11.2132, 30)    -877889.12 3405362.25  -> -2070137.82 -1467491.17
        probe 2  ( 31.2132, 30)    3275517.61 3679032.56  ->  2070137.82 -1467491.17
        probe 3  (-11.2132, 60)    -288654.67 6736782.66  -> -1169722.49  1859923.03
        probe 4  ( 31.2132, 60)    2039975.09 6989994.80  ->  1169722.49  1859923.03

      Probe 0 sits exactly on the definition's own `lat_0`/`lon_0`, so once the zone stops
      overriding them it forwards to the origin exactly. That is the cleanest evidence available
