    # entire blast radius across all 53,430 and both were UNCHANGED before. A full-line diff of the
    # two golden-report.tsv files adds these two lines and removes none.
    #
    # The two rows, with their measured movement:
    #   SYN proj/somerc probe 3   fy 0x1.c49625dfd2d7bp20 -> 0x1.c49625dfd2d71p20  (-10 ulp)
    #                             ix -0x1.66d29002e901ep3 -> -0x1.66d29002e9017p3  (+7 ulp)
    #                             iy 0x1.dffffffffffffp5  -> 0x1.dfffffffffffcp5   (-3 ulp)
    #   SYN proj/somerc probe 4   the same three dimensions, the same magnitudes; fx does not move
    #                             on either row.
    #
    # NOT probe 1, which also shows CHANGED in the report. It was already CHANGED before this
    # change, moves `ix` alone by 0x1.0p-48, and is claimed by NUM-KARNEY-LATITUDE-CORE. It is
    # byte-identical between the two legs. Probes 0 and 2 do not move at all. Enumerating the
    # probes rather than globbing the key is what keeps this rule from quietly adopting probe 1.
    expected_rows: 2
    reason: |
      SwissObliqueMercatorProjection's 33 transcendental call sites moved off java.lang.Math and
      onto FastStrictTrig (sin, cos, tan) and StrictMath (log, exp, atan). Math.sqrt and Math.abs
      are unchanged, being exactly specified by IEEE 754. This is a DETERMINISM fix, not an accuracy
      one: all seven of Math's sin/cos/tan/log/log10/exp/pow are @IntrinsicCandidate, so HotSpot
      substitutes a per-architecture routine and their last bit depends on the CPU. The symptom was
      a red `Build (JDK 21)` job -- eastings pinned on aarch64 came out as different doubles on
      x86-64, one of them by 0.51 m, because somerc's turning locus feeds an asin whose argument is
      1 to within a few ulp and whose derivative is unbounded there.

      WHY ONLY TWO ROWS OUT OF A LARGE SOMERC POPULATION -- population is not blast radius. The
      corpus holds twelve somerc index entries (five CSV, six REG including epsg:2056 and 21781, and
      the SYN family), and eleven of the twelve do not move a printed column. fdlibm and Apple's
      libm agree to the last bit on almost every ordinary argument; they part company only where a
      result is ill conditioned, and away from the turning locus somerc is not. The two rows that do
      move are the two SYN probes at 60 degrees north whose northing happens to sit ten ulp away.

      THE BAND IS AN ULP ARGUMENT, not a round number. The largest move is 0x1.4p-29 =
      2.328e-9, on `fy`, a projected northing of 0x1.c49625dfd2d7bp20 = 1,854,250.9 m whose ulp is
      2^-32 = 2.328e-10 -- so ten ulp, i.e. 2.3 nanometres on a 1,854 km ordinate. The inverse
      columns move 1.2e-14 and 2.1e-14 degrees, which against ulp(11.2) = 1.78e-15 and ulp(60) =
      7.11e-15 is seven and three ulp. The ceiling of 1.0e-8 is about forty ulp of that northing;
      anything larger is not a last-bit library difference and must stay UNEXPLAINED rather than be
      dignified by this rule. It is also two orders of magnitude below the 1e-6 that
      NUM-KARNEY-LATITUDE-CORE would have allowed it.

      NOT AN ACCURACY CLAIM IN EITHER DIRECTION, and the reason is measured. somerc.cpp's forward
      was transcribed to C with PROJ's own DEG_TO_RAD and built from one source as
      `clang -O2 -arch arm64` and `-arch x86_64`; fed identical input bits, the two slices of one
      libSystem disagree with each other by 0.0947 m and 0.1340 m at two of fourteen latitudes on
      the turning locus. PROJ 9.8.1 has no architecture-independent answer there, so bit parity with
      the oracle is not an available goal and determinism is. Against the arm64 `proj` binary the
      change moves somerc from 9 of 14 bit-identical eastings with two hard refusals to 12 of 14
      with none. Pinned by proj/SwissObliqueMercatorClampTest, whose static guard fails if any of
      the seven variant Math functions returns to this class.
    match:
      classifications: [CHANGED]
      sections: [SYN]
      keys: ["proj/somerc"]
      probes: [3, 4]
    expect:
      dimensions: [fy, ix, iy]
      allow_status_change: false
      allow_inside_change: false
      allow_nonfinite: false
      magnitude: {min: 0.0, max: 1.0e-8}

