      -1661.054028, -1661.018872, +1660.179562 and +1660.144423 on esri:25700's probes 1..4, and by
      only -7e-10 and -0.437240 on the three probe-0 rows, whose northing sits on `+y_0`.

      TWO: THE RECOVERED LONGITUDE IS NOW INSIDE +/-180 on esri:2934 and esri:21100. `ix` there moves
