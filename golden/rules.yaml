    expected_rows: 250
    reason: |
      +R now goes to DatumParameters. parser/Proj4Parser.java:1184-1188 reads it first in
      parseEllipsoid and calls datumParam.setR, which sets `a`, es = 0, f = 0 and sphere = true
      (DatumParameters.java:213-220), then returns -- so +R overrules every shape and spherification
