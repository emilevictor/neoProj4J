  - id: PROJ-AEA-SPHERICAL-INVERSE
    status: active
    expires: 2027-06-30
    # PINNED at 159, measured 2026-08-01 on a frozen /tmp snapshot. Corroborated independently by
    # FAILCLOSED-NAD27-OUTSIDE-GRID-REPORTED's reason, which predicts "PROJ-AEA-SPHERICAL-INVERSE
    # 164 -> 159 (-5)": five aea rows now throw on grid coverage and so have no numeric movement
    # left for this rule to attribute. golden/README.md's 164 is the pre-grid-rule figure and is
    # superseded, not contradicted.
    # RE-PINNED 2026-08-01 by the GRIDS-EPSG-SHIP-CONUS stream: proj4j-epsg now ships PROJ
    # 9.8.1's `conus` at proj4/nad/conus, so the golden run resolves that grid for the first
    # time (golden depends on proj4j-epsg and, unlike core's own tests and the conformance
    # module, has no other copy on its classpath). Measured on a frozen /tmp A/B whose two
    # trees differ in exactly one byte-bearing file, the grid itself. -5, and they are enumerable: the five `SYN mod/aea/nadgrids_conus` probes, all of which lie in
    # Europe or Africa and now report COORDINATE_OUTSIDE_GRID. Claimed by GRIDS-EPSG-CONUS-SYN-REFUSED.
    expected_rows: 154
    reason: |
      AlbersProjection.java:97-108 is the spherical inverse branch, and it is now right: the quantity
      PROJ names qs_div_2 is a local, `qsDiv2` (:103), asin is taken of that local (:104-105), and the
      pole fallback at :107 tests the sign of `qsDiv2`. The comment at :98-102 records what the
      BASELINE does, which is what these rows measure: it computed the same quantity into `out.y` as a
      scratch temporary and then took asin(lpphi) where lpphi is still rho/dd -- the RADIUS, not
      sin(phi) -- and its sign test was on lpphi too, which is >= 0 by construction, so the pole
      fallback could only ever return +90 degrees. For
      +proj=aea +R=6400000 +lat_1=0 +lat_2=2, the baseline inverse of (200, 100) m gives latitude
      89.957690088 where PROJ gives 0.000895246 -- an 89.9568 degree error -- and NaN wherever
      rho/dd > 1.

      This is ordered BEFORE the +R rule on purpose. The two are one release: in the baseline the aea
      defect is dormant only because the +R defect leaves `spherical == false`, so fixing +R alone
      turns a 6e-06 degree source-side error into 89.96 degrees. Keeping them as separate rules, with
      this one first, means the aea rows are attributed to the projection fix and the remaining +R rows
      to the parser fix, instead of one rule silently absorbing both.
    match:
      classifications: [CHANGED]
      sections: [SYN]
      keys: ["mod/aea/*"]
      tgt_proj: [aea]
    expect:
      dimensions: [fx, fy, fz, ix, iy, iz]
      allow_nonfinite: true

  # ---------------------------------------------------------------------------------------------
  - id: PARSE-RF-F-TRANSPOSED
    status: active
    expires: 2027-06-30
    # PINNED at 40, measured 2026-08-01 on a frozen /tmp snapshot, and structural rather than
    # data-driven: 4 modifier slugs (mod/*/rf and mod/*/f over the hosts that reach the ellipsoid)
    # x 5 probes. It also matches golden/README.md's independent "40 -- the only rows in the suite
    # this fix can move". Note the count is over the SYN section only, on purpose: world:palestine's
    # 5 REG rows are PARSE-RF-IN-WORLD-DICTIONARY's, and that split is the whole point of having two
    # rules. If this number moves, a host gained or lost the parameter, or that split broke.
    expected_rows: 40
    reason: |
      The two ellipsoid-shape setters used to be exactly transposed. They no longer are:
      parser/DatumParameters.java:264 setRF(rf) computes f = 1/rf then es = 2f - f*f, and :275 setF(f)
      computes es = 2f - f*f, which is PROJ's ell_set.cpp ellps_shape cases 0 and 1. In the BASELINE,
      which is what these rows measure, setRF(rf) computed es = rf*(2-rf) (treating rf as if it were f)
      and setF(f) computed rf = 1/f then es = rf*(2-rf) (treating f as if it were rf). So the
      baseline's +f IS PROJ's +rf, and its +rf is unusable: +ellps=GRS80 +rf=300 derives
      es = 300*(2-300) = -89400, b = a*sqrt(1-es) ~ 1.9 million km.

      There are two distinct downstream fates in the baseline depending on whether the projection
      reads `e` or `es`, and both appear in these rows: reading `e` gives e = sqrt(negative) = NaN so
      the northing is NaN and the easting is exactly correct; reading only `es` keeps everything finite
      and collapses the latitude inside GeocentricConverter, which for UTM 31 puts the easting exactly
      on +x_0 and the northing 500 km out. Hence allow_nonfinite and no magnitude band -- a band would
      have to span NaN and 5e5 at once.

      +rf= appears in NO registry dictionary and NO test CSV (zero occurrences, verified by grep), so
      these synthetic rows are the ONLY baseline rows this fix can move. That is why the synthetic
      parameter matrix exists.

      ^^ THE SENTENCE ABOVE IS HALF WRONG AND IS KEPT FOR THE RECORD. The CSV half holds; the
      dictionary half does not. The dictionaries write parameters WITHOUT the leading `+`, so
      `grep '+rf='` finds nothing while `grep 'rf='` finds world:palestine and world:malay. See
      PARSE-RF-IN-WORLD-DICTIONARY below, which claims world:palestine's 5 rows -- they were
      UNEXPLAINED for as long as this rule's `sections: [SYN]` was believed to be exhaustive. The
      conclusion that the synthetic matrix is necessary is unaffected: it is what puts +rf in front
      of six different host projections, and world:malay is unreachable in 1.4.3 for an unrelated
      reason.
    match:
      classifications: [CHANGED]
      sections: [SYN]
      keys: ["mod/*/rf", "mod/*/f"]
    expect:
      dimensions: [fx, fy, fz, ix, iy, iz]
      allow_status_change: true
      allow_inside_change: true
      allow_nonfinite: true

