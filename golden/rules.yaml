  - id: PROJ-RPOLY-LAT0-NOW-APPLIED
    status: active
    expires: 2027-06-30
    # PINNED at 5 = 1 projection x 5 probes. Structural: `proj/rpoly` is one synthetic key and the
    # sweep gives every key five probes, so this count can only move if rpoly leaves the matrix.
    #
    # SPLIT OUT OF FAILCLOSED-NO-INVERSE-FOR-FORWARD-ONLY, WHICH STILL DESCRIBES HALF OF IT. See
    # that rule's expected_rows note for why: it declares no magnitude band, on the correct
    # grounds that its rows' moved dimensions are all-NaN inverse columns, and rpoly's rows now
    # also carry a 5,009,377 m forward change that the same absent band would have hidden.
    expected_rows: 5
    reason: |
      `SYN proj/rpoly`, all five probes: `moved=fy,ix,iy,iz,status`, `OK` ->
      `EXC:CrsTransformException`.

      TWO INDEPENDENT CHANGES SHARE THESE FIVE ROWS. They are stated separately because a future
      revert of either must be visible, and only one of them is new.

      1. THE INVERSE, unchanged from FAILCLOSED-NO-INVERSE-FOR-FORWARD-ONLY and claimed on exactly
      the same grounds. `9.8.1:src/projections/rpoly.cpp` declares itself `"Conic, Sph, no inv"`
      and its `PJ_PROJECTION(rpoly)` assigns only `P->fwd`; there is no `P->inv`. So `ix`, `iy`,
      `iz` and the status are the fail-closed gate refusing an inverse that upstream does not
      have, which is the fix 75 rows of that rule record.

      2. THE FORWARD, WHICH IS NEW AND IS WHY THIS RULE EXISTS. `+lat_0` was being dropped.
      `RectangularPolyconicProjection` declared a private `phi0` field, never assigned it, and read
      it twice in `project()` -- so both reads returned a constant `0.0` and every rpoly definition
      was computed as though it were centred on the equator. Upstream's `P->phi0` is plain
      `+lat_0` in radians (`9.8.1:src/init.cpp:651`, `PIN->phi0 = pj_param(ctx, start,
      "rlat_0").f`), and the field this library fills from `+lat_0` is the inherited
      `projectionLatitude` -- the same one `PolyconicProjection.project` reads, since the
      projection subtracts the central parallel itself and the base class does not pre-subtract.

      THE MAGNITUDE IS THE PROOF AND IS PINNED FOR THAT REASON. `CANONICAL` carries `+lat_0=45`,
      and 45 degrees in radians times GRS80's semi-major axis is
      0.7853981633974483 x 6378137 = 5,009,377.08 m. The observed magnitude is
      `0x1.31bf8457c1093p22` = 5,009,377.085, on probe 0, with the other four probes one ULP below
      it. So the whole of the forward movement is the central parallel arriving, and the band below
      is tight enough that any OTHER change to the rpoly forward -- including the `+lat_ts` path
      described next -- fails this rule instead of hiding in it.

      WHAT IS NOT VISIBLE HERE, STATED SO THE SILENCE IS NOT MISREAD AS COVERAGE. The same commit
      restores rpoly's `+lat_ts` handling, which had been commented out under a `FIXME` because it
      called `pj_param`, and assigns `es = 0` as `rpoly.cpp:57` does. Neither shows up in this
      matrix: `+lat_ts` is a MODIFIERS entry but rpoly is not one of the six HOSTS, `CANONICAL`
      does not carry `+lat_ts`, so `mode` stays false on every row here and the restored branch is
      never entered. `es = 0` moves nothing because rpoly's forward reads neither `es`, `e` nor
      `spherical`. Both are covered by `core`, not by golden. If rpoly is ever added to HOSTS these
      five rows are unaffected and new `mod/rpoly/*` rows appear, which is the correct shape.
    match:
      classifications: [CHANGED]
      sections: [SYN]
      keys: ["proj/rpoly"]
      status_from: "OK"
      status_to: "EXC:org.locationtech.proj4j.CrsTransformException"
    expect:
      dimensions: [fx, fy, fz, ix, iy, iz]
      allow_status_change: true
      allow_inside_change: true
      allow_nonfinite: true
      magnitude: {min: 5.0e+6, max: 5.1e+6}

