  - id: DICT-ESRI-OMERC-VARIANT-A-NEEDS-NO-UOFF
    status: active
    expires: 2027-06-30
    # PINNED at 43 = 38 REG + 5 CSV, and every one of the 43 is enumerable.
    #
    #   REG  esri:24571, esri:26931, esri:102120, esri:102121, esri:102122, esri:102123,
    #        esri:102631                                    probes 0..4        35 rows
    #   REG  esri:26731                                     probes 0, 2, 4      3 rows
    #   CSV  PROJ4_SPCS_EPSG_nad83.csv:00002 .. :00006      probe 0 only        5 rows
    #
    # WHY esri:26731 CONTRIBUTES 3 AND NOT 5. Its probes 1 and 3 end at
    # EXC:CrsTransformException, not OK, and are already claimed by
    # FAILCLOSED-NAD27-OUTSIDE-GRID-REPORTED at the top of this file -- the NAD27 grid has nothing
    # to say at those two points, and that refusal happens whichever omerc variant runs. This
    # rule's status_to: "OK" declines them on the predicate, so the count does not depend on rule
    # order. 8 codes x 5 probes = 40, minus those 2, is the 38.
    #
    # MEASURED, NOT DERIVED. Two golden runs over the same tree, differing only in whether
    # epsg/src/main/resources/proj4/nad/esri carries the eight +no_uoff, with the reports diffed
    # row by row: exactly 43 of the 41,486 CHANGED rows differ between them, 38 REG and 5 CSV.
    #
    # THE FOUR HEADLINE COUNTS DO NOT MOVE, AND THAT IS THE POINT WORTH KNOWING. All 43 rows were
    # already CHANGED and already UNEXPLAINED before the dictionary fix; the fix changes their
    # magnitudes and nothing else. So UNCHANGED stays 11944 and CHANGED stays 41486 either way,
    # and this rule's whole effect on the run is INTENDED 39199 -> 39242 and
    # UNEXPLAINED 2287 -> 2244. Anyone reconciling this release's arithmetic should not look for
    # 43 rows arriving from the UNCHANGED side, because none did.
    expected_rows: 43
    reason: |
      Eight `+proj=omerc` entries in the shipped ESRI dictionary declared EPSG method 9815, Hotine
      Oblique Mercator variant B, where PROJ 9.8.1's own definition of the same code declares
      method 9812, variant A. They now carry `+no_uoff` and `+gamma`, which is what 9.8.1 emits:

        projinfo -o PROJ EPSG:26931
          +proj=omerc +no_uoff +lat_0=57 +lonc=-133.666666666667
                      +alpha=323.130102361111 +gamma=323.130102361111 +k=0.9999 ...

      and the same for EPSG:24571, EPSG:26731 and ESRI:102120, 102121, 102122, 102123, 102631.

      THE MECHANISM, AND WHY IT IS A SHIFT. 9.8.1:src/projections/omerc.cpp computes one constant
      at setup time and subtracts it from one coordinate:

        if (no_off) Q->u_0 = 0;
        else        Q->u_0 = fabs(Q->ArB * atan(sqrt(D * D - 1.) / cos(alpha_c)));

      and in the forward, after `u` and `v` are found,

        u -= Q->u_0;
        xy.x = v * Q->cosrot + u * Q->sinrot;
        xy.y = u * Q->cosrot - v * Q->sinrot;

      with `sinrot`/`cosrot` being sin and cos of `gamma`. `u_0` depends only on the parameters, so
      running variant A where variant B ran adds the same vector to every point:
      `(dx, dy) = u_0 * (sin gamma, cos gamma)`. That is what the rows show. Recovering the angle
      from the measured shift returns `gamma` to ten digits -- `atan2(dx, dy)` is 323.1301023611
      for esri:26731 and esri:26931, 337.2555555556 for the four Michigan GeoRef codes, and
      323.1301023542 for esri:102631, whose `+gamma=-36.8698976458333` is the same angle written
      negative.

      SEVEN OF THE EIGHT MOVE BY A PURE TRANSLATION, AND THE EIGHTH DOES NOT. A missing origin
      shift is a translation and nothing else, so the shift vector should be identical at all five
      probes, and for seven codes it is -- identical to within one to four last bits, a relative
      spread of about 1e-16, which is the rounding floor and not a signal:

        esri:26731   |shift| = 22864206.423 US survey feet
        esri:26931   |shift| =  6968872.110 metres
        esri:102120  |shift| = 17369726.947 US survey feet
        esri:102121  |shift| = 17369726.434 US survey feet
        esri:102122  |shift| =  5294303.362 metres
        esri:102123  |shift| =  5294303.206 metres
        esri:102631  |shift| = 22863707.917 US survey feet

      esri:24571 is the exception and has to be described separately: PROJ gives it
      `+alpha=323.0257905` with `+gamma=323.130102361111`, an angle 0.1043° away, and when both are
      supplied omerc.cpp derives `gamma0` from `alpha` while taking the rotation from `gamma`
      (`if (alp) { gamma0 = aasin(sin(alpha_c) / D); if (!gam) gamma = alpha_c; }`). So supplying
      `+gamma` changes the rotation as well as zeroing `u_0`, and the movement is a rotation plus a
      translation: over the five probes the shift spreads by about 100 units on a 27,491-unit
      magnitude, a relative spread of 3.7e-3 -- four thousand times the floor the other seven sit
      at. Nothing about esri:24571's movement is constant, and the rule does not claim it is.

      THIS MAKES THE REPORTED DEVIATION LARGER, AND IT IS STILL A CORRECTNESS FIX. The golden
      baseline is released proj4j 1.4.3, and 1.4.3 was wrong about these codes in a third way of
      its own -- neither variant A nor variant B. So moving from one wrong answer to the right one
      increases the distance from the baseline. The five CSV rows are the clean demonstration,
      because their expected values are committed alongside them in
      core/src/test/resources/PROJ4_SPCS_EPSG_nad83.csv, from the original PROJ4 test83 data:

        row :00003, EPSG:4269 (57.0, -133.666666666667) -> ESRI:102631
          committed expected      2685941.919   1886799.668
          1.4.3 baseline         16404166.667 -14374753.296
          this tree, before fix  16404166.667 -16404166.667
          this tree, after fix    2685941.9168  1886799.6665
          cs2cs 9.8.1             2685941.9168  1886799.6665

      All five of those CSV rows now agree with their committed expected values, and with 9.8.1,
      to a few millimetres -- inside the 0.1 tolerance the CSV itself declares. What grew is the
      divergence from 1.4.3. The error shrank to nothing.

      Those five rows used to be commented out, four of them tagged "Bug in Proj4J Obl Merc". Both
      the comment characters and the tag are removed in this release, because the bug was never in
      the omerc kernel -- fed the old shipped definition, PROJ 9.8.1 reproduces the wrong answer bit
      for bit. This moved no golden row: MetaCrsCsv strips a leading '#' and reads the row anyway,
      so all five were already in the baseline. What changed is that core's MetaCRSTest now runs
      them too.

      WHY EIGHT AND NOT ALL SEVENTEEN. The dictionary holds 17 `+proj=omerc` entries and the other
      nine are genuinely variant B: 2056, 2057, 21780, 21781, 23700, 29700, 29871, 29872, 29873.
      PROJ 9.8.1 emits no `+no_uoff` for any of them -- 2056, 21780, 21781 and 23700 it answers as
      `+proj=somerc` altogether, and 2057, 29700 and the three 2987x are omerc with `+gamma` and no
      offset suppression. Those nine correctly carry no `+no_uoff` here and do not move. A sweep
      that added `+no_uoff` wherever it saw `omerc` would have broken all 45 of their rows, so the
      eight are named one at a time and a ninth arrival is a COUNT_MISMATCH rather than something
      that gets absorbed.

      WHAT THIS RULE DOES NOT VOUCH FOR. It claims whole rows, and on esri:24571 a row carries more
      movement than this fix caused: its `fz` and `iz` differ from baseline by about 9.3e-10, and
      `ix`/`iy` by around 1e-14, in both runs alike -- byte-identical with and without the eight
      `+no_uoff`. Those are last-bit differences from other work in this release and this rule is
      not their explanation, only their current owner. The `dimensions` list has to sanction them
      because the alternative is that the rule declines the row and 43 goes back to being
      UNEXPLAINED. The magnitude band is set from the measured spread of the 43: the smallest is
      5725.107 at esri:24571 probe 1 and the largest 17596536.818 at esri:26731 probe 4.
    match:
      classifications: [CHANGED]
      sections: [REG, CSV]
      keys: ["esri:24571", "esri:26731", "esri:26931",
             "esri:102120", "esri:102121", "esri:102122", "esri:102123", "esri:102631",
             "PROJ4_SPCS_EPSG_nad83.csv:00002", "PROJ4_SPCS_EPSG_nad83.csv:00003",
             "PROJ4_SPCS_EPSG_nad83.csv:00004", "PROJ4_SPCS_EPSG_nad83.csv:00005",
             "PROJ4_SPCS_EPSG_nad83.csv:00006"]
      status_from: "OK"
      status_to: "OK"
    expect:
      dimensions: [fx, fy, fz, ix, iy, iz]
      magnitude: {min: 1.0e3, max: 2.0e7}

  # ---------------------------------------------------------------------------------------------
  # THE TWO CASSINI RULES BELOW ARE ORDERED LAST, after NUM-KARNEY-LATITUDE-CORE, and that is what
  # keeps every other pin in this file still. 191 of the 205 `REG`/`SYN` rows whose target is
  # `+proj=cass` are CHANGED; 30 of them are claimed by NUM-KARNEY-LATITUDE-CORE and were before
  # these rules existed. Placed anywhere ahead of that rule these two would take some of its 30 and
  # turn 19309 into a COUNT_MISMATCH. Placed at the very end of the file they can only take rows no
  # rule wanted, so no existing expected_rows moves at all -- verified by diffing the run's matched
  # counts before and after.
  #
  # THE TWO BANDS ARE DISJOINT -- 1e-6 .. 1e4 below and 1e5 .. 1e7 for the `link` rule -- so their
  # relative order does not affect either count either. The narrower rule is written first anyway,
  # to match this file's convention.
  #
  # SECTION `CSV` IS DELIBERATELY OUT OF SCOPE and 29 more cass rows stay UNEXPLAINED because of it:
  # 28 that the sign rule below would otherwise claim and 1 that the `link` rule would.
  # golden/README.md marks the 1,308 `CSV` rows "reserved; do not rule" pending the user's decision
  # on the 1,163-row proj4-epsg.csv re-pin, and NUM-KARNEY-LATITUDE-CORE's reason cites that
  # reservation as a reason not to widen its own ceiling. The same reservation binds here. The
  # mechanism below explains those 29 rows just as well as the 161 -- the closed form predicts all
  # 28 sign rows and the `link` ratio is exact on the 1 -- so when the reserved re-pin lands, the
  # two `sections:` clauses can be widened and the pins raised 156 -> 184 and 5 -> 6.
  - id: PARSE-UNITS-LINK-NOW-RECOGNISED
    status: active
    expires: 2027-06-30
    # PINNED at 5, and all five are one key: `REG epsg:3140`, probes 0..4. epsg:3140 is the ONLY
    # definition carrying `+units=link` in all 9,013 shipped CRS --
    # `grep -rhoE '\+units=[a-z0-9-]+'` over the five dictionaries returns 6,456 `m`, 760 `us-ft`,
    # 143 `ft` and exactly 1 `link` -- which is why a defect in the unit table shows up on cass rows
    # and nowhere else. The sixth affected row, `CSV proj4-epsg.csv:01241`, also targets EPSG:3140
    # and is left UNEXPLAINED under the reserved-CSV rule above.
    expected_rows: 5
    reason: |
      1.4.3 SILENTLY TREATED `+units=link` AS METRES, so every EPSG:3140 coordinate came out a
      factor of 0.201168 too small. This is a unit-table defect, not a Cassini one, and it is
      written as its own rule for that reason.

      THE MECHANISM, BOTH SIDES. 1.4.3's `Proj4Parser` did read the parameter --
      `Units.findUnits(s)` then `setFromMetres(1.0 / unit.value)` -- and `Units.LINKS` did exist,
      declared `new Unit("link", "links", "link", 0.201168)`. What was missing is that `LINKS` was
      not in the `Units.units` ARRAY that `findUnits` searches. That array held DEGREES, five metric
      units, four imperial and four US units, and `findUnits` ends

        return METRES;

      with no error and no log line, so an unknown name resolves to metres and the caller cannot
      tell. `link` was one of eight declared units left out of the array; `chain`, `us-chain`,
      `fathom`, `point`, `radian`, `arc minute` and `arc second` were the others. This tree's
      `Units.LINEAR_UNITS` carries PROJ's full linear list including `LINKS`, so `findUnits("link")`
      now returns it.

      Upstream applies it in `fwd_finalize`, `coo.xy.x = P->fr_meter * (P->a * coo.xy.x + P->x0)`,
      with `fr_meter = 1 / to_meter` -- so `+x_0` is in metres and the finished coordinate is in
      links.

      THE MAGNITUDE IS A PURE SCALE FACTOR AND IT IS EXACT. On the northing, which the Cassini
      easting fix below does not touch, current / baseline is 4.970969538 on all five probes, and
      1 / 0.201168 = 4.970969537898672 -- agreement to every digit printed. So the rows moved by
      being rescaled, not by being recomputed.

      AND THE NEW VALUE IS PROJ 9.8.1's, CHECKED DIRECTLY. At probe 0 (178E, 18S):

        $ echo "178 -18 0" | cs2cs -f "%.6f" +proj=longlat +datum=WGS84 \
            +to +proj=cass +lat_0=-18 +lon_0=178 +x_0=109435.392 +y_0=141622.272 \
                +a=6378306.3696 +b=6356571.996 +towgs84=98,390,-22,0,0,0,0 +units=link +no_defs
        545954.517791   703214.595585 0.000000

      This tree writes 545954.517791 / 703214.595585 -- identical. Drop `+units=link` from that same
      command and 9.8.1 answers 109828.578435 / 141464.273765, which is the 1.4.3 baseline row to
      every digit. Two runs of one binary, differing in one parameter, reproduce both sides of the
      diff: that is the whole of the mechanism.

      WHY THE BAND STARTS AT 1e5. The five magnitudes are 5.6e5 .. 2.7e6, all of them `fx` or `fy`
      in links. A floor of 1e5 keeps this rule out of the Cassini easting rule below (whose ceiling
      is 1e4) and far out of NUM-KARNEY-LATITUDE-CORE's 1e-6, so none of the three can absorb
      another's rows even if reordered.

      `fz` and `iz` are listed because they also move on probes 1..4: `fz` by 9.3e-10 m, ULP drift on
      the `+towgs84` height, and `iz` by 1.5e-5 .. 4.1e-5 m, which is the round trip's height landing
      differently now that the horizontal inverse converges. Neither is a vertical change and both
      are far under the band, which is set on the maximum over the moved dimensions -- here always
      `fx` or `fy`.

      NOT FIXED HERE, AND REPORTED RATHER THAN FIXED: `findUnits` still returns METRES for a name it
      does not know rather than refusing. That is the property that let this defect survive a
      release silently, and this tree's javadoc records it at Units.java:61. Changing it is a
      fail-closed API decision with its own row movement and belongs in its own commit.
    match:
      sections: [REG]
      keys: ["epsg:3140"]
      tgt_proj: [cass]
      classifications: [CHANGED]
      status_from: "OK"
      status_to: "OK"
    expect:
      dimensions: [fx, fy, fz, ix, iy, iz]
      allow_status_change: false
      allow_inside_change: false
      allow_nonfinite: false
      magnitude: {min: 1.0e5, max: 1.0e7}

  # ---------------------------------------------------------------------------------------------
  - id: PROJ-CASS-EASTING-A4-SIGN-CORRECTED
    status: active
    expires: 2027-06-30
    # PINNED at 156 = 152 REG + 4 SYN, and the shape of the 156 is the evidence, not a row list.
    # Thirty-nine keys:
    #
    #   36 keys        probes 1, 2, 3, 4 only        144 rows
    #   epsg:8044, epsg:8045    probes 0..4            10 rows
    #   epsg:3381      probes 3, 4 only                 2 rows
    #
    # WHICH ROWS DO *NOT* MOVE IS THE PART THAT CONFIRMS THE MECHANISM, because the term below
    # carries a factor of lam^5 * tan^2(phi) and therefore has to vanish in exactly two places:
    #
    #   probe 0 is the CRS's own (lon_0, lat_0), so lam = 0 and the term is identically zero. 28 of
    #     the 30 cass rows NUM-KARNEY-LATITUDE-CORE claims are probe 0, at magnitudes 4.4e-16 ..
    #     7.6e-7, i.e. under its 1e-6 ceiling.
    #   the two exceptions are epsg:8044 and epsg:8045, and they are exceptions for a reason that
    #     is not an exception at all: both carry `+pm=ferro`, so their probe 0 is 17.6667 deg off
    #     the central meridian, not on it. `cs2cs` puts probe 0 of epsg:8044 at x = 1,305,172 m.
    #   epsg:3381 probes 1 and 2 sit at latitude -0.0237 deg, where tan^2(phi) = 1.7e-7 kills the
    #     term instead. Their fx moves 7.56e-7 m -- and those are precisely the other two of
    #     NUM-KARNEY-LATITUDE-CORE's 30, at exactly that rule's ceiling.
    #
    # So the 30 rows this rule does not claim are the 30 the mechanism predicts it must not, and the
    # split falls on the 1e-6 floor without that floor having been chosen to make it fall there.
    expected_rows: 156
    reason: |
      PROJ 9.8.1 CORRECTED THE SIGN OF THE A^4 TERM IN THE CASSINI-SOLDNER FORWARD EASTING and
      proj4j 1.4.3 predates the fix. `9.8.1:src/projections/cass.cpp:41` reads

        xy.x = nu * A * (1. - A2 * T * (C1 + (8. - T + 8. * C) * A2 * C2));

      where 1.4.3's `CassiniProjection.project` read `(C1 - (8. - t + 8. * c) * a2 * C2)`. The
      upstream change is `78d89828`, "cass: fix forward computation of easting (fixes #3432)"; this
      tree's `CassiniProjection` carries the `+` and says so in its javadoc.

      THE CLOSED FORM, AND IT IS TESTED ROW BY ROW. Subtracting the two spellings leaves one term:

        x_plus - x_minus = -2 * C2 * nu * A^5 * T * (8 - T + 8C)

      with A = lam*cos(phi), T = tan^2(phi), C = es*cos^2(phi)/(1-es), nu = 1/sqrt(1-es sin^2 phi),
      scaled by a and divided by the CRS's to_meter. That expression was evaluated in a throwaway
      script -- not by this library -- from each definition's own ellipsoid and each probe's
      datum-shifted latitude and longitude, the shift taken from `cs2cs` 9.8.1, and compared with
      the measured `fx` movement of all 156 rows:

        predicted / measured    min 0.998141    median 1.000000    max 1.000487
        156 of 156 within 1%,  154 of 156 within 0.1%

      The only two rows outside 0.1% are two of the four `+datum=potsdam` rows discussed below, and
      they are the two rows whose baseline and current values BOTH sit a couple of hundred metres off
      PROJ, so a fractional slip of 0.2% in a delta is the expected consequence of that and not a
      failure of the closed form. Across all 220 cass rows the agreement is 214 of 220 within 2%,
      counting the 28 rows where the term and the movement are both exactly zero.

      A single term of a single projection's forward, with no free parameters, accounting for every
      row's magnitude.

      IT IS NOT THE DATUM END, AND THAT WAS THE OTHER HYPOTHESIS. The corrected term is in `xy.x`
      alone, so it must move the easting and leave the northing alone -- and it does. Over the 186
      cass rows whose easting moves at all and which are not the `+units=link` key, |d fy| / |d fx|
      has median 1.54e-9, p90 9.08e-8 and maximum 2.98e-5, and NOT ONE row has the northing moving
      even a thousandth of what the easting moves. A datum or ellipsoid change would move both
      together. The other 28 of the 214 non-link rows have `d fx` EXACTLY zero -- they are the probe-0
      rows, where the term vanishes -- so their ratio is undefined rather than large. Counted the
      other way round: `fy` clears 1e-6 m on only 9 of the 220 cass rows in the report, and 6 of
      those 9 are the two `+units=link` keys above.

      THE NEW VALUES ARE PROJ 9.8.1's. Replaying all 220 cass rows through `cs2cs` 9.8.1 -- WGS84
      hub to the definition text, at the committed probes -- this tree reproduces 185 of the 190
      previously-unexplained rows in both `fx` and `fy`, where the 1.4.3 baseline reproduced 10.

      THE FIVE THAT DO NOT MATCH 9.8.1 ARE `+datum=potsdam` AND THEY ARE STILL THIS RULE'S. Four are
      `REG epsg:3068` probes 1..4, whose easting is 49 m .. 200 m and northing 91 m .. 228 m away from
      `cs2cs`; the fifth is a CSV row out of scope. That residue is a datum-side disagreement about Potsdam, it is the SAME on both
      legs of the diff, and it therefore cancels in the movement -- epsg:3068's four rows are among
      the 156 whose `fx` delta the closed form predicts to better than 1%. Worth writing down
      because it is the honest reading: this rule claims that these rows MOVED for the reason given,
      not that they have arrived at the right answer. The Potsdam residue is somebody else's row and
      it is not in this file because it does not move.

      WHY THE ROUND-TRIP COLUMNS MOVE TOO, and why `ix`/`iy` are in `dimensions`. Two further
      changes in the same file act on the inverse: the meridian arc moved to `MeridianArc`, the port
      of `9.8.1:src/mlfn.cpp` with a closed-form inverse, and `cass.cpp:75-82`'s
      `pj_generic_inverse_2d` refinement at a 1e-12 residual is now performed, where 1.4.3 stopped
      at the truncated D^4 series. Measured as |(ix,iy) - (lon,lat)| in degrees over the 219 of the
      220 cass rows that have a finite inverse on both sides (the 220th is the CSV row discussed at
      the end):

        1.4.3 baseline      median 1.18e-6      p90 0.124        max 2.92
        this tree           median 1.43e-14     p90 4.39e-11     max 1.35e-7

      The excluded row is the worst of the lot on the baseline side and leaving it out understates the
      improvement rather than flattering it: 1.4.3 answered that inverse instead of refusing it, and
      the answer it gave was 64.9 degrees from the point it started at.

      190 of the 219 improve by more than a factor of two. Twelve get very slightly worse and all
      twelve are probe 0, going from an exact 0 to between 4.4e-16 and 7.3e-15 degrees, which is one
      Newton step declining to leave a value that was already right alone -- 1e-15 degrees is 0.1
      nanometres. The inverse is now an inverse of the forward by construction, which is the property
      `roundtrip` asserts and the reason upstream added the refinement.

      THE BAND IS 1e-6 .. 1e4 IN RAW COLUMN UNITS. The observed 156 span 3.90e-6 .. 2257.94; the
      floor is NUM-KARNEY-LATITUDE-CORE's ceiling, so the two rules partition the cass rows rather
      than competing for them, and the ceiling is four orders of magnitude under
      PARSE-UNITS-LINK-NOW-RECOGNISED's floor. The band is wide because the mechanism is: lam^5
      spans five orders of magnitude between a probe 1 deg off the central meridian and one 18 deg
      off. What keeps the rule narrow is not the band but `tgt_proj: [cass]`, which can reach at
      most the 205 `REG`/`SYN` rows the 41 cass-target cases have.

      THIS RETIRES TWO ROWS NUM-KARNEY-LATITUDE-CORE's OWN REASON LISTS AS UNATTRIBUTED. That
      reason's 1e-6 .. 1e-5 census names "3.904e-6 cass" among the 20 rows its candidate arc
      mechanism failed to predict -- `REG epsg:4394` probes 1 and 2, at 3.9035e-6 and 3.9160e-6.
      They are the two smallest rows here and the closed form above predicts both to 0.002%.
      The arc was the wrong candidate for them; the easting sign is the right one.

      TWO THINGS FOUND AND DELIBERATELY NOT FIXED, both recorded here rather than acted on.

      First, `CSV proj4-epsg.csv:01241` probe 0 -- the one cass row that changes STATUS, from OK to
      `ProjectionException`, and therefore the one this rule could not claim even if the `CSV` section
      were in scope. Its target is EPSG:3140 and the forward now lands 9.7e7 links from the origin,
      where `GenericInverse2D` gives up: "generic 2D inverse did not converge in 15 iterations".
      PROJ 9.8.1 REFUSES THE SAME POINT -- `cs2cs` answers `*  * inf` there -- and its forward,
      -97161737.620276, is this tree's forward to the last digit. So the refusal matches upstream and
      the row is not evidence of a defect; golden/README.md already carries it as the suite's one
      non-ETM OK-to-exception row, unattributed, pointing at `util/GenericInverse2D`.

      Second, nothing is left to fix in `CassiniProjection` itself. The `+hyperbolic` variant is
      present and read by presence, as upstream reads it, and NO shipped definition uses it -- and
      EPSG:3140, Vanua Levu, is exactly the CRS that should, since EPSG method 9833 is defined for it.
      Its dictionary entry does not carry the flag, so the tree computes the non-hyperbolic
      Cassini-Soldner for it, as 9.8.1 does from the same text and as 1.4.3 did. That is a dictionary
      question about one CRS, not a projection defect and not this rule's.
    match:
      sections: [REG, SYN]
      tgt_proj: [cass]
      classifications: [CHANGED]
      status_from: "OK"
      status_to: "OK"
    expect:
      dimensions: [fx, fy, fz, ix, iy, iz]
      allow_status_change: false
      allow_inside_change: false
      allow_nonfinite: false
      magnitude: {min: 1.0e-6, max: 1.0e4}
