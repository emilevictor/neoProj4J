  - id: NUM-ELLIPSOID-AUSTRALIAN-ALIAS-ADDED
    status: active
    expires: 2027-06-30
    # PINNED at 5 = 1 ellipsoid name x 5 probes. Structural.
    #
    # DELIBERATELY NOT FOLDED INTO NUM-ELLIPSOID-FOUR-NAMES-ADDED ABOVE, WHICH IT OTHERWISE MATCHES
    # EXACTLY -- same section, same `EXC:InvalidValueException` -> `OK`, same all-NaN baseline, same
    # `-` -> `F` on `inside`, same expect clause. Extending that rule to five keys would have been a
    # two-word edit and it would have made the rule lie: its reason's load-bearing sentence is "All
    # four ship in 9.8.1:src/ellps.cpp", quoted line by line from the table, and `australian` is the
    # one name here of which that is not true. A name PROJ has and a name PROJ does not have are
    # different claims about the world and they get different rules, on the same grounds
    # DATUM-LEGACY-CARTHAGE-ELLIPSOID and its sibling are kept apart: a future revert of either must
    # show up as its own COUNT_MISMATCH.
    expected_rows: 5
    reason: |
      `SYN ellps/australian`, all five probes:
      `EXC:InvalidValueException: crs-tgt: Unknown ellipsoid: australian` -> `OK`.

      A MISSING ALIAS, NOT A MISSING ELLIPSOID, and the distinction is the whole content of the
      fix. `Ellipsoid.AUSTRALIAN` has been defined in this library for as long as the class has
      existed. It was simply absent from `Registry.ellipsoids`, which is the table `+ellps=` is
      resolved against, so the name failed lookup while the object it names sat one file away. The
      fix adds the existing constant to the table; it defines no new figure and computes no new
      number.

      `australian` IS NOT A PROJ NAME AND THIS RULE IS NOT A PARITY CLAIM. PROJ 9.8.1's
      `src/ellps.cpp` has `aust_SA` and nothing called `australian`, so `+ellps=australian` is a
      proj4j extension that upstream would reject. It is kept, and registered, because it is
      long-standing published API and removing it would break callers for no gain.

      NUMERICALLY IT IS `aust_SA` UNDER ANOTHER NAME, which is what makes the five new rows safe to
      accept without a per-probe argument. Both are a = 6378160.0 and 1/f = 298.25.
      `Ellipsoid.AUSTRALIAN` also carries a `poleRadius` of 6356774.7, and it is the only entry
      anywhere in the library with both `poleRadius` and `rf` non-zero -- but the constructor gives
      `reciprocalFlattening` precedence, so that value is discarded and b is recomputed as
      6356774.719195. Measured after the fix, `aust_SA` and `australian` agree to the bit:
      b = 6356774.719195, e = 0.081820179996060. The declared pole radius is 0.019 m off and has
      never been read.

      NOTE WHAT THIS RULE IS NOT CLAIMING, given the company it keeps. NWL9D and andrae were in
      this same table with the SAME class of defect and a very different outcome -- see
      NUM-NWL9D-ANDRAE-POLE-RADIUS-TRANSPOSED, where the flattening was in the `poleRadius` slot
      and the transforms ran on a disc. `australian` never produced a wrong answer, because it
      never produced an answer at all; it threw. The baseline side of all five rows is all-NaN by
      construction, so nothing numeric is absorbed here and no regression can hide. `inside` moves
      `-` -> `F` for the reason PROJ-MOD-STER-GS50-DOMAIN-REFUSED spells out.
    match:
      classifications: [CHANGED]
      sections: [SYN]
      keys: ["ellps/australian"]
      status_from: "EXC:org.locationtech.proj4j.InvalidValueException"
      status_to: "OK"
    expect:
