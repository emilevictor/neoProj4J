    # `esri:53004`, `esri:54004` -- pair `+lat_ts=0` with a `+k` of exactly 1, which the branch
    # cannot change.
    #
    # `dimensions` IS THE UNION OF THE MOVED SETS THE REPORT PRINTS, counted row by row against the
    # committed 1.4.3 baseline: `fx` on all 15, `fy` on all 15, `ix` on the 10 rows of esri:2934 and
    # esri:21100, `iy` on 13 (all but probe 0 of those two keys) and `iz` on 2 (esri:25700 probes 2
    # and 4, a height moving by 9.3e-10 m). `fz` is deliberately left out, so that anything moving a
    # height on the forward leg stops this rule matching and surfaces the row. Magnitude is the MAX
