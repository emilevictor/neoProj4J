  - id: FAILCLOSED-NO-INVERSE-FOR-FORWARD-ONLY
    status: active
    expires: 2027-06-30
    # PINNED at 60 = 12 forward-only projections x 5 probes. Was 65 = 13 x 5, 85 = 17 x 5, and
