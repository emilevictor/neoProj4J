  - id: PROJ-MOD-STER-GS50-DOMAIN-REFUSED
    status: active
    expires: 2027-06-30
    # PINNED at 5 = one key x 5 probes.
    expected_rows: 5
    reason: |
      `SYN proj/gs50` is the one member of the modified-stereographic family whose arrival is NOT a
      transition to `OK`, which is why PROJ-NEW-PROJECTIONS-REGISTERED's 36-name list excludes it
      and this rule exists separately. Baseline: `crs-tgt: Unknown projection: gs50`. Current:
      `EXC:ProjectionException`, `inv: Mod. Stereographic of 50 U.S.: modified-stereographic
      inverse of (<x>, <y>): ...` at all five probes.

      That is the correct answer, not a half-finished port. `+proj=gs50` is the 50-state US
      modified stereographic, and the synthetic matrix evaluates every `proj/<name>` key on the
      SAME canonical parameter set -- `+ellps=GRS80 +lat_0=45 +lon_0=10 +lat_1=30 +lat_2=60 +x_0=0
      +y_0=0 +units=m` -- whose probes are therefore at longitude 10 East, in central Europe,
      several thousand kilometres outside the polynomial's region of validity. 9.8.1's
      `src/projections/mod_ster.cpp` inverse is a Newton iteration on a complex Chebyshev-style
      polynomial and does not converge out there either; refusing is what "a failure must never be
      expressed as a plausible coordinate" requires.

      Both endpoints are exception rows, all-NaN on both sides. This rule says the name now
      resolves and the out-of-domain refusal is intended; it says nothing about any gs50 coordinate,
      because it has never seen one.

      `allow_inside_change` IS SET, AND ONLY BECAUSE THE GATE MADE ME NOTICE. Written without it,
      this rule matched all five rows and DECLINED all five, reporting
      `inside changed (- -> F) and allow_inside_change is not set` -- so it was a DEAD_RULE on its
      first run. The flag moves `-` -> `F` for a reason worth recording: `-` is what
      `GoldenGenerator` writes when the CRS could not be built at all, so `Projection.inside` was
      never called, and `F` is a real answer from a real `ModifiedStereographicProjection`. The
      `inside` flag going from "not asked" to "asked, and no" is part of this change, not an
      independent one; `Projection.inside` has zero callers in `core` (golden/README.md, "File
      format") so nothing depends on it either way.
    match:
      classifications: [CHANGED]
      sections: [SYN]
      keys: ["proj/gs50"]
      status_from: "EXC:org.locationtech.proj4j.InvalidValueException"
      status_to: "EXC:org.locationtech.proj4j.ProjectionException"
