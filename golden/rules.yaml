      THE PER-ROW ARITHMETIC IS EXACT, WHICH IS WHY THE BAND CAN BE THIS NARROW. Only `k` changed,
      and `+x_0` and `+y_0` are added after the scale rather than multiplied by it, so on every row
        fx_now - fx_1.4.3 = 0.003 * (fx_now - 3900000)
        fy_now - fy_1.4.3 = 0.003 * (fy_now - 900000)
      The largest residual over those 30 checks is 1.4e-9 m. The left side is the move as the report
      prints it, current minus baseline; `fx_now - 3900000` is negative on all 15 rows, which is why
      every `fx` move below is negative. The six distinct `fx` moves, in metres:
        esri:2934, esri:21100  probe 0: -35665.205286  probes 1,3: -37334.803957  probes 2,4: -33995.606615
        esri:25700             probe 0: -35662.900573  probes 1,3: -37332.541064  probes 2,4: -33993.260199
      so the band 3.39e4..3.74e4 brackets those six and nothing else. IT IS NOT SIZED FROM THE
