  - id: PROJ-NZMG-NONCONVERGENCE-TYPED
    status: active
    expires: 2027-06-30
    # PINNED at 11 = `world:new_zealand` x 5 + `SYN proj/nzmg` x 5 + `proj4-epsg.csv:03288` x 1.
    # The CSV file carries exactly one NZMG case at one pinned coordinate, hence the odd total.
    expected_rows: 11
    reason: |
      A pure error-taxonomy change: `EXC:InvalidValueException: inv: Infinite longitude` ->
      `EXC:ConvergenceFailureException: inv: New Zealand Map Grid: inverse complex-polynomial
      iteration did not converge to 1.0E-10 within 20 trips for ...`.

      1.4.3's NZMG inverse ran its complex-polynomial fixed-point iteration, took whatever it had
      when it stopped, and let the resulting non-finite longitude be discovered by a downstream
      finiteness test that reported it as an INVALID VALUE -- i.e. as if the input had been bad.
      The input was fine; the iteration failed. `ConvergenceFailureException` says so, and it is
      the type 9.8.1 reserves for this (`PROJ_ERR_COORD_TRANSFM_NO_CONVERGENCE`).

      That all three keys are far outside New Zealand is the reason they do not converge and is not
      a defect: `world:new_zealand`'s own probes come from its `+lat_0`/`+lon_0`, but `SYN
      proj/nzmg` inherits the canonical `+lon_0=10 +lat_0=45` (central Europe) and
      `proj4-epsg.csv:03288` probes the file's single fixed point `(1.0, -1.0)` in the Gulf of
      Guinea -- golden/README.md, "Probe derivation".

      Both endpoints are exception rows, all-NaN both sides, so no coordinate is vouched for. NOTE
      FOR THE NZMG OWNER, and the reason this rule stops where it does: `SYN proj/nzmg`'s FORWARD
      returns `fx = -3.52e18 m` at probe 4 in BOTH trees, and the change from `-3.52038367e18` to
      `-3.52052221e18` is why those rows appear elsewhere in the report with magnitudes of 1e14.
      A number like that is a failure expressed as a coordinate; it predates the baseline, this
      rule does not claim it, and it is not fixed.
    match:
      classifications: [CHANGED]
