    status: active
    expires: 2027-06-30
    # PINNED at 2, keys and probes ENUMERATED rather than globbed. Measured 2026-08-14 on a frozen
    # A/B: two full golden runs from one tree differing in exactly one file,
    # proj/SwissObliqueMercatorProjection.java, and within that file in nothing but the choice of
