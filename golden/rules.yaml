    status: active
    expires: 2027-06-30
    # PINNED at 5 = one key x 5 probes.
    expected_rows: 5
    reason: |
      THE FOURTH NAME THAT LEFT FAILCLOSED-NO-INVERSE-FOR-FORWARD-ONLY, AND THE ONLY ONE OF THE
      FOUR THAT LEFT BY GETTING STRICTER RATHER THAN BY GAINING AN INVERSE. `SYN proj/nsper`
      moves `OK` -> `EXC:InvalidValueException` at all five probes, with the message

        crs-tgt: +h=0.0 gives h/a = 0.0, which nsper rejects: upstream requires 0 < h/a <= 1e10
        (nsper.cpp:155-159). The bound is on the ratio, not on h.

      This is the only `OK -> ProjectionException`-family transition in the whole unexplained
      set that is not the reserved ETM domain cluster, so it is worth being explicit that it is
      a fail-closed improvement and not a capability loss.

      UPSTREAM, READ RATHER THAN RECALLED. 9.8.1:src/projections/nsper.cpp, `nsper_setup`:

          Q->height = pj_param(P->ctx, P->params, "dh").f;
          ...
          Q->pn1 = Q->height / P->a;                    /* normalize by radius */
          if (Q->pn1 <= 0 || Q->pn1 > 1e10) {
