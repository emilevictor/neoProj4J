      -5 and +5 latitude -- on every one of the 13 decimals `proj -I -f "%.13f"` prints.

      THIS RULE REPLACES PROJ-FORWARD-WRAP-CANONICALISES-RECOVERED-LONGITUDE, which covered the wrap
