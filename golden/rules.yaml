      numeric regression can hide behind it. Equally, it makes NO claim that the coordinate now
      produced is right. That question belongs to gie, per this file's opening policy: the
      conformance module is where these names' values are judged, and every one of the 49 is
      exercised there. (This clause used to read "22 of these 36 names have `.gie` coverage". That
      count was true of the original 36 and has not been re-derived on the same footing since, so
