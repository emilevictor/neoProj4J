      There is no presence test, so an absent `+h` and an explicit `+h=0` are one input upstream
      and are refused together. That is why the fix is a field default of 0 plus this range test,
      and not a presence check in Proj4Parser: a presence check would refuse the absent form and
      accept `+h=0`, which is the opposite of upstream on one of the two.

      WHAT WE USED TO DO. The class held 35785831.0, the nominal geostationary height, and the
      canonical synthetic parameter set
      `+ellps=GRS80 +lat_0=45 +lon_0=10 +lat_1=30 +lat_2=60 +x_0=0 +y_0=0 +units=m` carries no
      `+h`, so every `proj/geos` probe answered from a satellite the definition never mentioned.
      Measured with proj 9.8.1: `echo "10 20" | proj -f '%.9f' +proj=geos +ellps=GRS80` is
      `Error 1027 (Invalid value for an argument): geos: Invalid value for h.`, while
      `+h=35785831` gives `1027290.592281427 2135974.287029047`, which this tree still returns.

      Baseline is a coordinate and the current side is all-NaN. The rule vouches for nothing
      numeric; it records that five plausible-looking coordinates for an unnamed satellite are now
      an error. `inside` moves because the CRS no longer builds.

      GIE AGREES ABOUT THE REFUSAL AND THIS CHANGE BROKE THE TWO ROWS THAT SAY SO, WHICH IS NOT
      CORROBORATION AND HAD TO BE FIXED IN THE SAME CHANGE. builtins.gie:2183 is
      `operation +proj=geos +R=1 +h=0` and :2188 is `+proj=geos +R=1 +h=1e11`, each followed by
      `expect failure errno invalid_op_illegal_arg_value`. Both were GENUINE PASSES before this
      change, not vacuous ones: proj4j built the operation -- initialize() had no test, so `+h=0`
      was accepted -- and the forward then refused the coordinate, which GieRunner.java:450-462
      scores as a pass through ExpectedFailureVerdict.ofTransformFailure(). With initialize()
      throwing, construction fails instead, and a
      Proj4jException from construction is mapped to NOT_IMPLEMENTED
      (Proj4jGieOperationFactory.mapConstructionThrowable, the `instanceof Proj4jException` arm),
      which ExpectedFailureVerdict.ofConstructionFailure scores VACUOUS_EXPECTED_FAILURE -- counted
      as neither a pass nor a failure. So the conformance gate reported 2 REGRESSED. The fix is a
      `geos` case in conformance ProjOperatorSetup, modelled on the existing nsper/tpers h/a case,
      so the bridge decides that PROJ ITSELF refuses the definition and reports
      INVALID_DEFINITION, which is a genuine pass again. Measured in this worktree with
      `mvn -B -Pconformance -pl conformance -am verify`: unchanged 7446, still failing 477,
      regressed 0, unexpected passes 0, new 0, disappeared 0. gie is the one that decides, and it
      does not decide by being left un-run.
    match:
      classifications: [CHANGED]
      sections: [SYN]
      keys: ["proj/geos"]
      status_from: "OK"
      status_to: "EXC:org.locationtech.proj4j.InvalidValueException"
    expect:
