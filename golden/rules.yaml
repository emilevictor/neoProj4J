    # nothing about a longitude convention changing.
    # RE-PINNED 2026-08-13 by the +proj=geos refusal, -2, and enumerable: `SYN proj/geos` probes 3
    # and 4. They sat here because the RECOVERED LATITUDE drifted by 2 ULP on a coordinate this tree
    # no longer produces: bare `+proj=geos` used to answer from a 35785831 m orbit height nobody
    # asked for, and now refuses. That is a status change, which this rule declines on purpose, so it
    # let both rows go and they are claimed by PROJ-GEOS-REQUIRES-A-POSITIVE-H-RATIO. The other three
    # `proj/geos` probes -- 0, 1 and 2 -- were UNCHANGED against the baseline before this change and
    # are in that rule's five as well, which is why this count falls by 2 and not by 5.
    # The count is measured in this worktree with `mvn -B -Pgolden -pl golden -am verify`, from the
    # COUNT_MISMATCH the previous pin reported. WHICH two rows, and in which dimension, is measured
    # separately: replaying the five probes through `+proj=geos <canonical> +h=35785831`, the old
    # class default written out by hand, reproduces the pre-change rows, and only probes 3 and 4
    # differ from golden/baseline/1.4.3/golden.tsv -- `iy` 0x1.e000000000023p5 -> 0x1.e000000000021p5
    # on both, which is 2 ULP or about 1.4e-14 degrees at 60 N, plus `ix` 2 ULP on probe 3. Both are
    # far inside this rule's 1e-6 band, which is why it held them until the status changed.
    # RE-PINNED 2026-08-14 by the merc `+lat_ts` presence fix, -5, and enumerable: `REG esri:25700`,
    # probes 0..4. That key is the SAME DEFINITION as the two named in the 2026-08-13 block above,
    # with only a `+towgs84` added, and it corrects that block on one point: counted over the 9,013
    # definitions in the five dictionaries the REG section reads, THREE shipped definitions pair a
    # `+lon_0` past 180 with a `+pm`, not two. esri:25700 is the third. Its `ix` was already inside
    # +/-180 in the 1.4.3 baseline, so the wrap change did not move it and it stayed here on sub-ULP
    # `fy` drift. It leaves now because an explicit `+lat_ts=0` has stopped being read as no
    # `+lat_ts` at all, so the definition's `+k=0.997` is discarded, `fx` moves by about 3.4e4 m and
    # the row is far outside this rule's 1e-6 band. Claimed by
    # PROJ-MERC-LAT-TS-PRESENCE-DISCARDS-K, which has the arithmetic. The 19303 is READ from this
    # run's own `COUNT_MISMATCH NUM-KARNEY-LATITUDE-CORE expected_rows=19308 but matched 19303` line
    # rather than computed. Nothing else in the run moves: UNCHANGED, CHANGED, ADDED, REMOVED,
    # INTENDED and UNEXPLAINED all print exactly the figures pinned in
    # golden/baseline/1.4.3/golden-expect.txt.
    #
    # RE-PINNED 2026-08-14 by the +over prime-meridian ordering fix, +6, and it is the first block
    # here that GAINS rows rather than losing them. They are `CSV proj4-epsg.csv:03408` probe 0,
    # `CSV proj4-epsg.csv:03409` probe 0, and `SYN mod/longlat/pm_numeric` probes 1..4. All six
    # matched golden/baseline/1.4.3/golden.tsv exactly before this change -- they were UNCHANGED,
    # which is why no rule held them -- and now differ in `ix` and nothing else, by one or two ULP:
    # 0x1.0p-53 on the two CSV rows, 0x1.0p-49 on pm_numeric probes 1 and 3, 0x1.0p-48 on probes 2
    # and 4. That is 1.1e-16 to 3.6e-15 degrees, far inside this rule's 1e-6 band, with no status
    # change and no second moved dimension, so this rule is where they belong.
    # THE CAUSE IS ASSOCIATION, NOT MAGNITUDE. The inverse now computes `adjlon(lam + lam0) + pm`
    # where it computed `adjlon((lam + pm) + lam0)`; on a definition whose `+pm` is a plain number
    # the two agree to every bit but the last few of the sum. `pm_numeric` probe 0 is not among the
    # six because it was CHANGED already.
    # Measured by set-differencing this worktree's golden-report.tsv against the same report from a
    # tree carrying no core change, both from `mvn -B -Pgolden -pl golden -am verify`: six rows
    # appear, none disappears, and this rule's claimed count moves 19308 -> 19314 to match.
    #
    # RECOMPUTED 2026-08-14 FOR THE 2.1.0 COMBINED BRANCH, AND THIS NUMBER IS ARITHMETIC, NOT
    # MEASURED. The +over block immediately above measured 19308 -> 19314 on the PRE-#23 base. This
    # branch's base is #23, where the block above it re-pinned the same rule 19308 -> 19303 by
    # dropping `REG esri:25700` probes 0..4. So 19314 does NOT carry over: the correct composition is
    # 19303 + 6 = 19309. The +6 survives the -5 intact because the two sets are disjoint - the five
    # rows #23 removed are all `REG esri:25700`, and the six #117 adds are `CSV
    # proj4-epsg.csv:03408` probe 0, `CSV proj4-epsg.csv:03409` probe 0 and `SYN
    # mod/longlat/pm_numeric` probes 1..4, none of which is an esri REG key.
    # CONFIRMED BY MEASUREMENT 2026-08-14. When this block was written, 19309 had not been read from
    # a COUNT_MISMATCH line, because the golden gate had not yet been run on this branch. It has now
    # been run - `./docker/run.sh ci conformance golden determinism` - and it emitted NO
    # COUNT_MISMATCH for this rule at all; instead it listed `NUM-KARNEY-LATITUDE-CORE: 19309` among
    # its matched counts. A COUNT_MISMATCH is precisely what a wrong pin produces here, so its
    # absence is the confirmation, and 19309 is now a measured figure rather than an arithmetic one.
    expected_rows: 19309
    reason: |
      PROVISIONAL AND NOT OWNED BY THIS MODULE. Placeholder for the sub-microscopic movement caused by
      wiring in PROJ 9.4-9.6's Karney auxiliary-latitude core (9.8.1:src/latitudes.cpp, and the
      rewritten mlfn.cpp / phi2.cpp / tsfn.cpp). Measured improvements at GRS80: authlat 1.58 mm ->
      0.7 nm, mlfn 4,920 nm -> < 1 nm, phi2 4,145 nm -> 2.1 nm, tsfn(0) 0.9999999999999999 ->
      exactly 1.0.

      The numerical-core owner must replace this rule with one carrying a pinned expected_rows and a
      band justified per section. It exists now only so that ~18,000 rows of genuine sub-micron drift
      do not bury the ~1,700 rows of structural change underneath them.

      The band is deliberately tight -- 1e-6 in raw column units, i.e. 1 micrometre for a projected
      target and ~0.1 m for the always-degrees inverse columns. Everything above the band stays
      UNEXPLAINED on purpose: that is the backlog. It also refuses status changes, inside changes
      and non-finite endpoints, so it cannot absorb anything structural.

      THIS PARAGRAPH USED TO SAY THE BAND WAS TIGHT "BECAUSE THE MEASURED MAGNITUDE DISTRIBUTION IS
      BIMODAL WITH AN EMPTY VALLEY BETWEEN 1e-5 AND 1e-3". THAT WAS FALSE AND IS CORRECTED HERE,
      2026-08-16, because a wrong empirical claim in a reason is a defect on its own -- and this one
      is load-bearing: a valley is the only thing that would make a ceiling in it self-evident.
      Counted over every CHANGED row in golden-report.tsv carrying a finite magnitude:

        1e-6 .. 1e-5       55 rows      12 INTENDED       43 UNEXPLAINED
        1e-5 .. 1e-4      233 rows     225 INTENDED        8 UNEXPLAINED
        1e-4 .. 1e-3   13,175 rows  13,157 INTENDED       18 UNEXPLAINED
        1e-3 .. 1e-2      746 rows     688 INTENDED       58 UNEXPLAINED

      13,408 rows in the supposed valley, and 1e-4 .. 1e-3 is the densest decade in the whole
      distribution -- it is where PROJ-TMERC-PODER-ENGSAGER-DEFAULT's 14,037 rows live, that rule
      having measured its own median at 2.53e-4 m. The distribution is not bimodal about 1e-6 either.
      The only gap anywhere near here is narrow, one-sided and does not survive the INTENDED rows:
      on the UNEXPLAINED side alone nothing sits between 9.719e-6 and 1.968e-5, a factor of 2.02,
      while 225 INTENDED rows occupy 1e-5 .. 1e-4.

      SO THE 1e-6 CEILING IS NOT JUSTIFIED BY A VALLEY. It is justified by being far enough below
      every neighbouring rule's floor to take nothing from them, and it stays until the
      numerical-core owner replaces this rule per the paragraph above. Do not read the absence of
      UNEXPLAINED rows below 1e-6 as evidence the ceiling is in the right place: this rule's matcher
      is `classifications: [CHANGED]` and nothing else, so every row under the ceiling is claimed by
      construction and that bucket is empty by definition, not by measurement.

      WIDENING THE CEILING TO 1e-5 WAS INVESTIGATED ON 2026-08-16 AND DECLINED. It would claim all
      43 UNEXPLAINED rows in 1e-6 .. 1e-5 -- and steal none, since no rule ordered after this one
      claims anything in that band -- so it is mechanically available. It is still wrong on two
      counts.

      FIRST, THE MECHANISM PREDICTS 23 OF THE 43 AND THE OTHER 20 ARE INTERLEAVED WITH THEM, so no
      ceiling separates the two populations. The candidate mechanism is the meridional arc: a tmerc
      northing is k0*(M(phi) - M(phi0)), two evaluations of a function whose old es-series form
      (ProjectionMath.enfn/mlfn) is wrong by up to 4,936 nm on GRS80 -- measured here at phi = 71.5
      deg by 16-point Gauss-Legendre against a(1-e2)*integral(1-e2 sin^2 t)^-1.5, which confirms the
      4,920 nm this reason cites above. Predicted movement per row is then
      k0*(err(phi0) - err(phi))/to_meter, and it was evaluated against the measurement row by row:

        23 rows      PROJ4_SPCS_EPSG_nad83.csv and PROJ4_SPCS_nad27.csv, fy the largest moved
                     dimension, predicted/measured 0.990 .. 1.049 across GRS80 and Clarke 1866,
                     latitudes 41.5 .. 71 deg, on and off the central meridian
        14 rows      fx largest: 4 REG esri:102016/102019 aeqd, 2 REG epsg:4394 cass, 8
                     proj4-epsg.csv tmerc at 2 deg from the central meridian
         4 rows      REG epsg:4188, fz largest, a longlat -> longlat height with no arc in it
         2 rows      proj4-epsg.csv:01262/01263, lcc, which uses tsfn/phi2 and not the arc at all

      The 23 span 1.03e-6 .. 9.72e-6 and the other 20 sit inside that same span -- 1.545e-6 aeqd,
      1.796e-6 tmerc fx, 2.127e-6 lcc, 3.904e-6 cass, 5.762e-6 fz, 6.010e-6 tmerc fx. Interleaved,
      not separated. A 1e-5 ceiling would claim 43 rows on a mechanism covering 23 of them, which is
      the trade golden/README.md refuses: a rule asserting an intent nobody stated is worse than an
      UNCHANGED row.

      TWO OF THE 43 HAVE SINCE BEEN CLAIMED AND THE CENSUS ABOVE IS LEFT AS IT WAS MEASURED. The
      "3.904e-6 cass" row and its twin are `REG epsg:4394` probes 1 and 2, and
      PROJ-CASS-EASTING-A4-SIGN-CORRECTED at the end of this file now claims them on a mechanism
      that predicts their magnitude to 0.002% -- the sign of Cassini-Soldner's A^4 easting term, not
      the arc. So the 1e-6 .. 1e-5 decade reads 55 rows / 14 INTENDED / 41 UNEXPLAINED as of
      2026-08-16, and the candidate-arc tally is 23 predicted of 41 rather than of 43. The numbers
      above are not rewritten because they are a dated measurement and this is what changed since;
      the conclusion is untouched and slightly strengthened, since two of the 20 interleaved rows
      turned out to have a different mechanism entirely. The 55 / 14 / 41 is re-measured off
      golden-report.tsv after the two new rules landed, not adjusted by hand.

      AND THE "TWO ARC EVALUATIONS SO ~9.8e-6 m" CEILING THAT MADE 1e-5 LOOK PRINCIPLED IS WRONG BY
      A FACTOR OF TWO. err(phi) is essentially one-signed over 0 .. 90 deg -- measured min -8.4 nm at
      17.5 deg, max +4,936 nm at 71.5 deg -- so a difference of two evaluations is bounded by the
      spread, 4,944 nm, not by the sum, 9,872 nm. The mechanism cannot produce more than 4.944e-6 m
      on GRS80. The cluster appears to reach 9.72e-6 only because these SPCS targets are in US survey
      feet: 9.719e-6 ft is 2.96e-6 m, comfortably inside the bound. Two errors -- a doubled bound and
      an unconverted unit -- happened to cancel.

      SECOND, WIDENING WOULD LAUNDER ROWS A NEIGHBOURING RULE DECLINES ON PURPOSE. 33 of the 43 are
      section CSV: 23 SPCS and 10 proj4-epsg.csv. PROJ-TMERC-PODER-ENGSAGER-DEFAULT, ordered three
      rules earlier and covering 1e-6 .. 1e-2, excludes "Section CSV in its entirety ... 157 of them
      are below this rule's ceiling and would have been claimed; they are not, because 'still moving'
      beats 'would have matched'", and golden/README.md marks the 1,308 CSV rows "reserved; do not
      rule" pending a user decision on the 1,163-row proj4-epsg.csv re-pin. This rule's matcher has
      no `sections:` clause, so a wider ceiling here would silently take what that rule refused --
      the same laundering this file's ordering discipline exists to prevent.

      THE 26 ROWS ABOVE 1e-5 ARE SOMEBODY ELSE'S AND STAY ON THE BACKLOG, and there is a better
      candidate than this rule for them: all 26 are fx-largest, and on the 18 proj4-epsg.csv tmerc
      rows fx grows monotonically with distance from the central meridian -- 1.97e-5 m at 3.1 deg,
      7.6e-5 at 4 deg, 2.7e-4 at 5 deg, 8.47e-4 at 6.000 deg. TransverseMercatorProjection's own
      javadoc tabulates Evenden/Snyder minus Poder/Engsager as "about 0.9 mm" at 6 deg; 0.85 mm
      measured at 6.000 deg is that table to one significant figure. They belong to the tmerc
      stream and to the reserved CSV re-pin, not here.

      Note the short expiry. This is a migration-window rule, not a specification.
    match:
      classifications: [CHANGED]
    expect:
      dimensions: [fx, fy, fz, ix, iy, iz]
      allow_status_change: false
      allow_inside_change: false
      allow_nonfinite: false
      magnitude: {min: 0.0, max: 1.0e-6}

  # ---------------------------------------------------------------------------------------------
  # ORDERED LAST, DELIBERATELY. Its magnitude band (1e-4 .. 1e4) overlaps the top of
  # PROJ-TMERC-PODER-ENGSAGER-DEFAULT's (1e-6 .. 1e-2), so placed before that rule it would take its
  # NAD27 tmerc rows and turn a pinned count into a COUNT_MISMATCH -- the same hazard that made the
  # tmerc rule have to follow DATUM-LEGACY-OSGB36-PRECISION. Verified on the frozen tree that all 852
  # rows this claims were UNEXPLAINED beforehand and that it takes nothing from any other rule.
  - id: DATUM-NAD27-NADCON-SHIFT-APPLIED
    status: active
    expires: 2027-06-30
    # PINNED. Measured 2026-08-01 on the same frozen A/B as
    # FAILCLOSED-NAD27-OUTSIDE-GRID-REPORTED, with the predicate evaluated against the report before
    # the rule was written. 865 REG rows carry datum=NAD27 and are OK -> OK; 852 of them are inside
    # the band and 13 are not -- see the last paragraph.
    # RE-PINNED 2026-08-01 by the GRIDS-EPSG-SHIP-CONUS stream: proj4j-epsg now ships PROJ
    # 9.8.1's `conus` at proj4/nad/conus, so the golden run resolves that grid for the first
    # time (golden depends on proj4j-epsg and, unlike core's own tests and the conformance
    # module, has no other copy on its classpath). Measured on a frozen /tmp A/B whose two
    # trees differ in exactly one byte-bearing file, the grid itself. +1,074, the other side of FAILCLOSED-NAD27-OUTSIDE-GRID-REPORTED's -1,104. The two are one
    # migration; the 30-row difference is the rows that land in the three GRIDS-EPSG-CONUS-* rules.
    expected_rows: 1926
    reason: |
      NAD27 registry CRS now receive the NADCON grid shift. In the 1.4.3 baseline they receive none
      at all, so every one of these rows moves by the whole shift.

      THE MECHANISM, and it is a parser fix rather than anything in this module's territory.
      parser/Proj4Parser used to call setGrids(null) on the SHARED STATIC Datum.NAD27 singleton
      while parsing any +datum=NAD27 definition carrying no +nadgrids token. EPSG:4267 is
      `+proj=longlat +datum=NAD27 +no_defs`, so the first NAD27 CRS parsed destroyed the grid list
      process-wide -- including its own -- and Datum.getTransformType() flipped
      TYPE_GRIDSHIFT -> TYPE_UNKNOWN for all 205 codes on that datum. Every NAD27 row in the 1.4.3
      baseline is therefore unshifted. The parser now copies into a DatumParameters instead, and
      Datum.setGrids refuses on NAD27 and POTSDAM outright. This matches PROJ, whose +datum=NAD27
      is nadgrids=@conus,@alaska,@ntv2_0.gsb,@ntv1_can.dat.

      WHAT IDENTIFIES IT AS THE DATUM AND NOT A KERNEL. Twelve of these rows have a `longlat`
      target -- no projection in the path at all -- and they move 1.71e-4 to 7.18e-4 DEGREES, i.e.
      19 m to 80 m. A projection kernel cannot move a row that runs no projection. epsg:4267 probe 0
      is the cleanest single instance: fx goes from -100.0, the input ECHOED BACK, to -99.99949894.

      THIS RULE COULD NOT BE WRITTEN BEFORE, AND THAT IS WHY THE `datums` COLUMN EXISTS. rules.yaml
      had no predicate for a parameter's VALUE: params_present matches KEYS, and `datum` is a key
      1,962 dictionary lines carry. Scoping this cluster by key meant enumerating ~205 keys, which
      would also have swept in ~1,066 rows belonging to a live stream -- exactly the shape of rule
      this file exists to prevent. golden-index.tsv now carries a sixth column holding the sorted
      set of +datum= values on either side, and `datums:` matches ANY-of over it. Five lines of
      rule, and the honest UNEXPLAINED paragraph in golden/README.md that stood in for it since the
      second triage can go.

      THE BAND, in the raw units this file warns about. 840 of the 852 have a projected target and
      move 1.0 m to ~1e3 m; 12 have a geographic target and move 1.71e-4 to 7.18e-4 degrees. One
      band has to span both because magnitude is not unit-normalised here, so it is stated as
      measured rather than as a round number: floor 1e-4 (below the smallest degree-column move,
      above nothing this rule wants), ceiling 1e4. Per-column maxima over the 852: fx 1.43e6 is
      EXCLUDED by the ceiling, and within the band fx/fy stay under 1e4 m and ix/iy under
      1.6e-7 deg. The floor also keeps this rule clear of the two sub-millimetre bands
      (NUM-KARNEY-LATITUDE-CORE at <=1e-6, PROJ-TMERC-PODER-ENGSAGER-DEFAULT at 1e-6..1e-2), both of
      which are ordered ahead of it in any case.

      THE THIRTEEN ROWS THIS DELIBERATELY DOES NOT CLAIM. `esri:26731` and `esri:102120` are omerc
      and move 6.1e5 to 2.03e6 metres -- 610 km to 2,030 km. That is not a datum shift by three
      orders of magnitude; it is the omerc far field, the same shape this module already declines to
      rule for the PAIR residue, where "both series are meaningless out there and a change from one
      meaningless number to another is not something a rule should dignify". They stay UNEXPLAINED
      and the report will record this rule DECLINING them on magnitude. -> omerc owner.

      NOT CLAIMED EITHER, on the sections' own reserved grounds: the 10 CSV and 29 PAIR NAD27
      OK -> OK rows. CSV is inside the reserved proj4-epsg.csv re-pin and PAIR's residue is
      explicitly not to be ruled. `sections: [REG]` is what keeps this rule out of both.
    match:
      sections: [REG]
      datums: [NAD27]
      status_from: "OK"
      status_to: "OK"
    expect:
      dimensions: [fx, fy, fz, ix, iy, iz]
      allow_status_change: false
      allow_inside_change: true
      allow_nonfinite: false
      magnitude: {min: 1.0e-4, max: 1.0e4}

  # ---------------------------------------------------------------------------------------------
  # proj4j-epsg now ships PROJ 9.8.1's `conus` (264,424 B, CTABLE V2, blob 44b4900f) at
  # proj4/nad/conus. The three rules below claim the 38 rows that move because of it and nothing
  # else. They are ordered LAST on purpose: every row they claim was UNEXPLAINED in the measured
  # run, so no earlier rule can lose a row to them and the six counts re-pinned above are exactly
  # what the frozen A/B measured.
  #
  # KEYS AND PROBES ARE ENUMERATED, NEVER GLOBBED, and the probe filters are load bearing rather
  # than decorative:
  #   * `mod/tmerc/nadgrids_conus` probes 1-4 were ALREADY UNEXPLAINED before this change (they
  #     belong to the transverse-Mercator stream, which rules.yaml states is awaiting a user
  #     decision and whose rows nothing in this pass may claim). Only probe 0 is newly changed, so
  #     GRIDS-EPSG-CONUS-SYN-TMERC-REFUSED takes probe 0 and leaves the other four where they are.
  #   * The twelve PAIR keys have all five probes UNEXPLAINED, but only probe 1 is NEW -- the other
  #     48 are pre-existing residue. A key-only rule would absorb 48 rows behind this reason, which
  #     is the exact failure this file was built to prevent.
  # Together they take UNEXPLAINED from 2,329 back to 2,291, the pre-change figure -- this stream
  # adds no residue and removes none.

  - id: GRIDS-EPSG-CONUS-SYN-REFUSED
    status: active
    expires: 2027-06-30
    # PINNED at 25 = 5 keys x 5 probes, measured on the frozen A/B before the rule was written.
    expected_rows: 25
    reason: |
      A CRS that declares `+nadgrids=conus` and is then handed a point in Europe or Africa now
      REFUSES instead of quietly returning the point unshifted.

      THE MECHANISM, and it is packaging rather than arithmetic. These synthetic definitions carry
      `+nadgrids=conus`. Until now no `conus` existed anywhere on golden's classpath -- golden
      depends on proj4j-epsg, which shipped only ntv1_can.dat -- so Grid.fromNadGrids resolved the
      token to NOTHING and left the grid list EMPTY. Grid.shift's fail-closed throw fires when a
      NON-empty list covers no grid for the point; an empty list is not that case, so the transform
      returned the input coordinate and reported success. proj4j-epsg now ships conus, the list is
      non-empty, and the refusal path is reachable for the first time.

      WHY REFUSING IS THE CORRECT ANSWER HERE, and it is checkable from the probe file rather than
      asserted. conus covers 131W-63W, 20N-50N. The five SYN probe points, decoded from
      probes.tsv's hex, are (10, 45), (-11.21, 30), (31.21, 30), (-11.21, 60) and (31.21, 60) --
      every one of them in Europe, Africa or the North Atlantic, between about 4,700 and 12,000 km
      outside the grid. A definition that names a US grid and is then asked about Cairo has no
      answer, and non-negotiable 3 says the failure must not be expressed as a plausible
      coordinate. The old behaviour returned the input unchanged, which is precisely that.

      NOT A REGRESSION AND NOT A WIDENING. The same run shows the CONUS points that ought to shift
      now shifting to PROJ 9.8.1's values -- see core's ConusShipsInEpsgArtifactTest, which pins
      San Francisco and Kansas against `cct +proj=hgridshift +grids=conus` and keeps Honolulu,
      San Juan, Anchorage and the Gulf of Guinea throwing.

      WHERE THESE ROWS CAME FROM. All 25 were INTENDED before this change, attributed to rules that
      describe projection and latitude arithmetic -- PROJ-AEA-SPHERICAL-INVERSE (the 5 aea rows)
      and NUM-KARNEY-LATITUDE-CORE (the lcc and longlat rows and their family). Those rules
      described the numeric drift of a coordinate that should never have been produced. With the
      coordinate withdrawn there is no drift left for them to describe, which is why both re-pin
      downward by exactly 5 and 12 and why that arithmetic is quoted at each of them.
    match:
      sections: [SYN]
      keys:
        - "mod/aea/nadgrids_conus"
        - "mod/lcc/nadgrids_conus"
        - "mod/longlat/nadgrids_conus"
        - "mod/merc/nadgrids_conus"
        - "mod/utm/nadgrids_conus"
      classifications: [CHANGED]
      status_from: "OK"
      status_to: "EXC:org.locationtech.proj4j.CrsTransformException"
    expect:
      allow_status_change: true
      allow_inside_change: true
      allow_nonfinite: true

  - id: GRIDS-EPSG-CONUS-SYN-TMERC-REFUSED
    status: active
    expires: 2027-06-30
    # PINNED at 1. `mod/tmerc/nadgrids_conus` probes 1-4 were UNEXPLAINED before this change and
    # stay UNEXPLAINED: they are the transverse-Mercator stream's rows and this file says nothing
    # in this pass claims any of them. Probe 0 was UNCHANGED before and is newly CHANGED, so it is
    # this stream's row and only it is claimed. Separating one row into its own rule is deliberate:
    # folding it into the rule above would have needed a key glob that also swept up the four.
    expected_rows: 1
    reason: |
      The `+proj=tmerc` member of the GRIDS-EPSG-CONUS-SYN-REFUSED family, split out so that the
      four probes belonging to another stream are not absorbed by this one. Same mechanism, same
      evidence: `+nadgrids=conus` now resolves, the probe point is outside the grid, and the
      transform reports COORDINATE_OUTSIDE_GRID instead of echoing the input back as a success.

      Probe 0 is (10, 45) -- central Europe, roughly 4,700 km east of conus's eastern edge at 63W.
    match:
      sections: [SYN]
      keys: ["mod/tmerc/nadgrids_conus"]
      probes: [0]
      classifications: [CHANGED]
      status_from: "OK"
      status_to: "EXC:org.locationtech.proj4j.CrsTransformException"
    expect:
      allow_status_change: true
      allow_inside_change: true
      allow_nonfinite: true

  - id: GRIDS-EPSG-CONUS-PAIR-NAD27-SHIFTED
    status: active
    expires: 2027-06-30
    # PINNED at 12 = 12 enumerated keys x probe 1 only. All five probes of these keys are
    # UNEXPLAINED, but the other 48 were UNEXPLAINED before this change too and belong to the PAIR
    # residue this file explicitly declines to rule. `probes: [1]` is what keeps this rule from
    # absorbing them; without it the rule would claim 60 and quietly retire 48 rows of somebody
    # else's backlog behind a grid reason.
    expected_rows: 12
    reason: |
      The positive half, in the PAIR section: NAD27-source pairs whose probe 1 falls INSIDE conus
      and which therefore receive a real NADCON shift for the first time.

      Every source here is a NAD27 geographic CRS -- epsg:4267, esri:4267 and esri:104000, which is
      ESRI's own NAD27 code -- and the targets are projected CRS in the epsg:2000-21418 range. In
