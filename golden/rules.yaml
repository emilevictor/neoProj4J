    expected_rows: 15
    reason: |
      TWO CHANGES LAND ON THESE SAME 15 ROWS and this rule covers both, because `GoldenDiff` gives a
      row to at most one rule and neither change can sanction the dimensions the other moves.

      ONE: `+lat_ts=0` NOW DISCARDS `+k=0.997`, so the scale factor on these three keys goes
      0.997 -> 1. PROJ's merc takes its `+lat_ts` branch on PRESENCE rather than on value --
      `9.8.1:src/projections/merc.cpp:47-68`, whose `is_phits` holds the answer of
      `pj_param(P->ctx, P->params, "tlat_ts").i`, and whose branch sets
      `k0 = msfn(sin(0), cos(0), es)`, which is 1. proj4j tested `trueScaleLatitude != 0.0`, so an
