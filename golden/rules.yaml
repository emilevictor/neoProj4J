      TAKES AN ORBIT HEIGHT. `SYN proj/geos` moves `OK` -> `EXC:InvalidValueException` at all five
      probes, with the message

        Invalid value for h: +proj=geos needs an orbit height in metres, greater than 0 and at
        most 1e10 times the semi-major axis; got 0.0 m over a = 6378137.0 m. An omitted +h is 0
        here, as it is upstream (geos.cpp:206,226-230)

      UPSTREAM, READ RATHER THAN RECALLED. 9.8.1:src/projections/geos.cpp, `geos_setup`:

          Q->h = pj_param(P->ctx, P->params, "dh").f;
          ...
          Q->radius_g_1 = Q->h / P->a;
          if (Q->radius_g_1 <= 0 || Q->radius_g_1 > 1e10) {
              proj_log_error(P, _("Invalid value for h."));
