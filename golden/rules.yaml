  - id: PROJ-CHAMB-MOD-KROVAK-OEA-ROUSS-REGISTERED
    status: active
    expires: 2027-06-30
    # PINNED at 20 = four names x five probes, and enumerable: `SYN proj/chamb`, `SYN
    # proj/mod_krovak`, `SYN proj/oea` and `SYN proj/rouss`, probes 0..4 each. Measured from
    # golden/target/golden/golden-report.tsv in this worktree BEFORE the rule was written, and the
    # whole-run arithmetic closes on its own: UNCHANGED 11994 -> 11974, CHANGED 41436 -> 41456,
    # ADDED and REMOVED still 0, UNEXPLAINED 2287 -> 2307. Twenty rows left UNCHANGED and twenty
    # arrived, so nothing else in the 53,430 moved -- in particular `SYN proj/krovak`, whose five
    # rows this change edits the source of, does NOT move and was already CHANGED for an unrelated
    # reason.
    expected_rows: 20
    reason: |
      Four PROJ 9.8.1 operators the Registry did not resolve now resolve, so their twenty synthetic
      rows stop being `EXC:InvalidValueException` ("Unknown projection: ..."). This rule vouches
      for the fact that they now build; each row's numbers are vouched for by the gie corpus, which
      is where the twenty-six assertions these four operators own are now checked to PROJ's own
      digits.

      Every SYN row is `+proj=<name>` plus InputSet.CANONICAL,
      `+ellps=GRS80 +lat_0=45 +lon_0=10 +lat_1=30 +lat_2=60 +x_0=0 +y_0=0 +units=m`, at five probes.
      The four names land in three different states, and each matches what proj 9.8.1 does with the
      identical string:

      `SYN proj/rouss` and `SYN proj/mod_krovak` -> OK, with numbers.
        echo "10 45" | proj -f "%.9f" +proj=mod_krovak +ellps=GRS80 +lat_0=45 +lon_0=10 \
             +lat_1=30 +lat_2=60 +x_0=0 +y_0=0 +units=m
          -5.270616269  -1660352.071123898
      and this run's probe 0 is -5.270616269468382, -1660352.0711238978. Same for rouss at probe 1,
      longitude -11.213203435596423, latitude 30: proj gives -2073683.266433114 -1439598.960911903
      and this run gives -2073683.2664331137, -1439598.9609119026. rouss probe 0 is the projection
      origin and is exactly (0, 0) on both sides.

      `SYN proj/oea` -> `EXC:ProjectionException`, and PROJ refuses the same string for the same
      reason. CANONICAL carries no `+n` and no `+m`, and oea.cpp:64-72 bounds both at `> 0` with
      pj_param's `d` sigil, which answers 0 for an absent key:
        echo "10 45" | proj +proj=oea +ellps=GRS80 +lat_0=45 +lon_0=10 +lat_1=30 +lat_2=60
          proj_create: Error 1027 (Invalid value for an argument):
          oea: Invalid value for n: it should be > 0
      Only the `status` column moves on these five: both sides are all-NaN, so this rule vouches
      for nothing numeric on them. The exception class changes because the reason changes -- from
      "there is no such projection" to "these parameters are not usable" -- which is the honest
      one.

      `SYN proj/chamb` -> `EXC:CrsTransformException`, but the FORWARD numbers are recorded and are
      PROJ's. The status is the inverse leg's: chamb has no inverse anywhere, upstream included
      (chamb.cpp defines only `chamb_s_forward` and never assigns `P->inv`), so
      `ChamberlinTrimetricProjection.hasInverse()` is false and the round-trip half of the probe
      throws. The forward at probe 0 is 39703.5106962626, -782516.4806961259 against proj's
      39703.510696263 -782516.480696126 on the same string. `fz` moves from NaN to 0 for the same
      reason it does on the other three: a height column exists once a forward runs.

      WHY `SYN proj/krovak` IS NOT IN THIS RULE. KrovakProjection is edited by this change --
      mod_krovak is the same setup function with a boolean, as it is upstream, so the polynomial
      correction sits behind an `isModified()` the base class answers false to. Its five rows are
      byte-identical to the previous run and remain claimed by whichever rule already had them.
      That is the control for the refactor: if the extra branch had cost a bit, these twenty would
      have been twenty-five.
    match:
      sections: [SYN]
      keys: ["proj/chamb", "proj/mod_krovak", "proj/oea", "proj/rouss"]
      classifications: [CHANGED]
      status_from: "EXC:org.locationtech.proj4j.InvalidValueException"
    expect:
      dimensions: [fx, fy, fz, ix, iy, iz]
      allow_status_change: true
      allow_inside_change: true
      allow_nonfinite: true

