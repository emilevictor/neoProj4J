  # ---------------------------------------------------------------------------------------------
  - id: PARSE-FIRST-MATCH-WINS
    status: active
    expires: 2027-06-30
    # PINNED at 71, measured 2026-08-01 on a frozen /tmp snapshot, matching the 71 previously
    # observed. The row set is the four duplicate-key modifier slugs (ellps_clrk66, units_us_ft,
    # units_km, x_0_y_0) over the six hosts, LESS the `mod/aea/*` share claimed earlier by
    # PROJ-AEA-SPHERICAL-INVERSE -- that cross-rule dependency is by design and is why this number
    # is not 4 x 6 x 5. If PROJ-AEA-SPHERICAL-INVERSE is ever reordered after this rule, this count
    # rises and that one falls; fix the ORDER, never the predicates.
    expected_rows: 71
    reason: |
      parser/Proj4Parser.java:1363-1365 now keeps the FIRST occurrence of a duplicated parameter --
      `if (!params.containsKey(key)) params.put(key, value)`. 1.4.3 put every token into a HashMap
      unconditionally and so kept the LAST. PROJ keeps the first: 9.8.1:src/init.cpp appends tokens
      to a paralist in order and pj_param's lookup returns the first match, which is why upstream
      documents later duplicates as inert.

      The synthetic matrix probes this on purpose. Its canonical parameter set is
      `+ellps=GRS80 +lat_0=45 +lon_0=10 +lat_1=30 +lat_2=60 +x_0=0 +y_0=0 +units=m` and the
      modifier is APPENDED, so exactly four of the 47 modifiers collide with a canonical key:
      ellps_clrk66, units_us_ft, units_km and x_0_y_0. Those four, over the six hosts, are this
      rule's entire row set.

      THE MECHANISM IS CONFIRMED BY EXACT ARITHMETIC, not by inspection:
        * mod/*/units_km   -- fx and fy are current = baseline * 1000 EXACTLY on every row.
        * mod/*/units_us_ft -- current = baseline * 0.304800609601219 exactly, which is
          1200/3937, the US survey foot. 1.4.3 emitted feet, having taken the appended
          `+units=us-ft`; the current build emits metres, taking the canonical `+units=m`.
        * mod/*/x_0_y_0    -- fx moves by exactly -500000 and fy by exactly -1000000 on every
          row: the canonical `+x_0=0 +y_0=0` now wins over the appended
          `+x_0=500000 +y_0=1000000`.
        * mod/*/ellps_clrk66 -- 18 .. 321 m, and the current values equal the corresponding
          GRS80 rows of the other modifiers to the last digit, so the ellipsoid in force changed
          from clrk66 to the canonical GRS80.

      WHAT THIS RULE DOES NOT VOUCH FOR. On the tmerc and utm hosts a second, much smaller
      movement is superimposed: the ratios come out as 999.999999999522 rather than 1000 and the
      inverse latitude moves by ~1e-7 degrees. That is the transverse-Mercator kernel rewrite, it
      is eight significant digits below the structural change, and it is the same drift
      NUM-KARNEY-LATITUDE-CORE claims on rows where nothing structural happened. This rule
      explains the unit and offset flip; it says nothing about that residue, and the residue is
      small enough that it cannot be what makes a row match.

      Units: fx/fy are the target CRS's units, which for these rows is the whole point -- the
      baseline is in feet or kilometres and the current row is in metres. See the units warning at
      the top of this file. The floor of 1.0 excludes pure-drift rows so they stay with the
      numerical-core rule where they belong.
    match:
      classifications: [CHANGED]
      sections: [SYN]
      keys: ["mod/*/ellps_clrk66", "mod/*/units_us_ft", "mod/*/units_km", "mod/*/x_0_y_0"]
    expect:
      dimensions: [fx, fy, fz, ix, iy, iz]
      magnitude: {min: 1.0, max: 1.0e8}

  # ---------------------------------------------------------------------------------------------
  - id: FAILCLOSED-UNCHECKED-ISE-REPLACED
    status: active
    expires: 2027-06-30
    # PINNED at 37 -- 24 PAIR + 13 CSV -- measured 2026-08-01 on a frozen /tmp snapshot.
    #
    # THIS IS THE RULE THAT MOST NEEDED PINNING, and its history is the argument for the
    # GoldenRulesTest assertion that now forbids `status: active` + `expected_rows: TBD`. While
    # unpinned it went 55 -> 71 by absorbing 16 NAD27 out-of-grid rows behind a reason that says
    # nothing about grids, and the theft was invisible precisely because there was no count to
    # violate. FAILCLOSED-NAD27-OUTSIDE-GRID-REPORTED is now ordered first and predicts, in its own
    # reason, that this rule "gives up all 34 of its NAD27 grid rows and lands at 37". It does. Two
    # independent sources, one number.
    #
    # 16 of the 24 PAIR rows also satisfy DATUM-TYPE-UNKNOWN-HOISTED's `t0*/*` / `t*0/*` key globs.
    # That is not this rule taking them: all 16 are status changes
    # (IllegalStateException -> ProjectionException) and that rule does not set
    # allow_status_change, so it declines them at any position in the file. Verified on the frozen
    # report, not assumed from the ordering.
    #
    # The stream that owns this is still live, and the direction of any future move is predictable:
    # a guard added upstream of GeocentricConverter moves a row between exception buckets without
    # changing this total, while a guard that turns a throw back into a coordinate removes one.
    # Either way the gate now says so instead of absorbing it.
    expected_rows: 37
    reason: |
      The BASELINE side of these rows is `EXC:java.lang.IllegalStateException`, which in 1.4.3 had
      exactly one source in this whole suite: datum/GeocentricConverter's out-of-range latitude
      guard, whose message is `Latitude is out of range: <phi>` (205 rows) or
      `Latitude is out of range: Infinity` (12 rows). It was an unchecked, non-Proj4jException
      throw, so it escaped every `catch (Proj4jException)` in the library and in every caller --
      the failure mode the fail-closed work exists to remove.

      GeocentricConverter.java:190-193 now raises CrsTransformException(INVALID_COORDINATE) at the
      same site and with a message that states the rounding allowance it exceeded. The other two
      current statuses are the SAME mechanism observed one stage earlier, because the fail-closed
      guards now catch the bad value before it reaches the geocentric converter at all: 46 rows
      end in `LongLat: invalid latitude ... exceeds PJ_EPS_LAT` from
      Projection.checkForwardDomain, and 12 in `Extended Transverse Mercator: forward projection
      ... returned a non-finite coordinate; refusing to apply totalScale/false easting to it` from
      the Projection.projectRadians output check. All three are "1.4.3 threw java.lang.* and
      proj4j now throws org.locationtech.proj4j.*", which is what status_to bounds.

      WHAT THIS RULE CANNOT LAUNDER. Both endpoints are exception rows and an exception row is
      all-NaN by construction, so there is no numeric value on either side for the rule to absorb;
      that is the entire reason it is safe to write while the stream is still moving. It changes
      no `inside` flag (verified: no claimed row lists `inside` among its moved columns).

      SIX ROWS IT DELIBERATELY DOES NOT CLAIM. `EXC:java.lang.IllegalStateException -> OK`:
      t03/epsg:4007>epsg:20022, t03/epsg:4034>epsg:20092, t20/epsg:4214>epsg:2366,
      t24/epsg:4155>epsg:26748 probe 4, t30/epsg:4817>epsg:2366, t34/epsg:4289>epsg:26748 probe 4.
      Those are a different mechanism -- a numerical change moved the latitude back inside the
      domain -- and the row now carries a real coordinate that nobody in this rule's chain of
      reasoning has vouched for. Claiming them would mean writing "1.4.3 crashed and we now return
      X" with no statement about X. They stay UNEXPLAINED and belong to whoever owns the
      projection that moved.

      Ordered BEFORE the two PAIR datum rules on purpose. 163 of these rows are in PAIR and both
      of those rules would match them on section and key; each declines them today only because
      neither sets allow_status_change. Relying on another rule's expect clause to decline is a
      silent coupling, so this rule claims them first and says why.
    match:
      classifications: [CHANGED]
      status_from: "EXC:java.lang.IllegalStateException"
      status_to: "EXC:org.locationtech.proj4j.*"
    expect:
      dimensions: [fx, fy, fz, ix, iy, iz]
      allow_status_change: true
      allow_nonfinite: true

