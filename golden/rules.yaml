    # PROJ-RPOLY-LAT0-NOW-APPLIED's, which restates the fail-closed inverse verbatim and adds the
    # magnitude band this rule cannot carry.
    #
    # THE TRIPWIRE FIRED A SECOND TIME, AND WAS RIGHT A SECOND TIME. On the 2026-08-01 late
    # triage this rule reported `COUNT_MISMATCH expected_rows=85 but matched 65`, and the four
    # missing keys were `proj/aitoff`, `proj/hammer`, `proj/nsper` and `proj/wintri`. All four
    # acquired a `projectInverse(double, double, ProjCoordinate)` this release and UPSTREAM
    # AGREES with all four, verified by reading 9.8.1 one file at a time rather than by
    # inference:
    #   * `src/projections/aitoff.cpp:200-201` -- `pj_aitoff_setup` assigns BOTH
    #     `P->inv = aitoff_s_inverse` and `P->fwd = aitoff_s_forward`, and it is the shared
    #     setup for `PJ_PROJECTION(aitoff)`:206 AND `PJ_PROJECTION(wintri)`:217, so the two
    #     names stand or fall together. That is why they left this list in the same run.
    #   * `src/projections/hammer.cpp:86-87` -- `P->fwd` then `P->inv = hammer_s_inverse`.
    #   * `src/projections/nsper.cpp:167-168` -- `P->inv = nsper_s_inverse`.
    # `aitoff`, `hammer` and `wintri` are now OK -> OK and are claimed by
    # PROJ-AITOFF-HAMMER-WINTRI-INVERSES-LANDED below; `nsper` is now refused for a completely
    # different reason (`+h` is absent from the canonical synthetic set) and is claimed by
    # PROJ-NSPER-REQUIRES-A-POSITIVE-H-RATIO.
    #
    # THE SHAPE OF THIS RULE'S HISTORY IS THE POINT. It has now shed five of its original
    # eighteen names -- lagrng, aitoff, hammer, nsper, wintri -- and every one of the five left
    # because upstream turned out to have an inverse that 1.4.3 did not. A rule written as
    # `keys: ["proj/*"]` would have absorbed all five silently and this file would still be
    # asserting that Aitoff is one-way. The enumeration is doing exactly the work it was
    # enumerated for.
    #
    # THE EARLIER TRIPWIRE, KEPT FOR THE RECORD. On 2026-08-01 this rule reported
    # `COUNT_MISMATCH expected_rows=90 but matched 85`, and the missing key was `proj/lagrng`:
    # LagrangeProjection acquired a `projectInverse(double, double, ProjCoordinate)` and its five
    # rows are now OK -> OK (claimed by PROJ-INVERSE-CORRECTED-ROUND-TRIP-NOW-EXACT-FWD-ALSO
    # below, where the inverse returns the committed probe to nine digits). That is CORRECT: 9.8.1
    # src/projections/lagrng.cpp:101-102 assigns BOTH `P->inv = lagrng_s_inverse` and
    # `P->fwd = lagrng_s_forward`, so Lagrange is invertible upstream and the 1.4.3-era belief that
    # it was forward-only was simply wrong. The name is removed from the list rather than the count
    # relaxed.
    #
    # ROUTE THIS, IT IS NOT ONLY A GOLDEN CONCERN: core's own
    # `NoInverseGateTest.baseProjectInverseRaisesForForwardOnlyProjections:96` asserts "Lagrange
    # must declare no inverse for this test to mean anything" and fails on the frozen tree. Two
    # streams disagree about lagrng; upstream sides with the one that gave it an inverse.
    expected_rows: 60
    reason: |
      THIS RULE RECORDS A FIX, NOT AN ADDED EXCEPTION, AND THE NUMBER THAT PROVES IT IS 75.

      Of the 90 rows this rule claimed when it was first written, **75 were `OK` in the 1.4.3
      baseline** (the row set is now 60; the argument is unchanged and the 75 is kept because it
      is the measurement that made it). That is direct
      measured proof of the defect: `Projection.projectInverse` was an unconditional identity
      (`dst.x = x; dst.y = y;`), `hasInverse()` was declared 66 times across 102 classes and read
      NOWHERE in `core/src/main` before 1.5.0, so a forward-only projection used as a
      transformation SOURCE handed the projected metres straight back as lon/lat radians -- which
      were then datum-shifted and re-projected as if they were geographic. **75 silently wrong
      answers became errors.** A future reader who sees 90 rows turn into an exception should be
      able to tell in one line that this was a fix; that is what the 75 is for.

      The other 15 rows were `EXC:InvalidValueException: Unknown projection` in 1.4.3 -- adams_hemi,
      adams_ws1 and guyou did not exist -- so they were never wrong, merely absent. Hence the rule
      keys on status_to and leaves status_from open: the two histories converge on the same correct
      current behaviour.

      The 12 projections, each `SYN proj/<name>` and each 5 probes:
        airy august boggs denoy larr lask nicol tcc wag7
        adams_hemi adams_ws1 guyou
      (`lagrng`, `aitoff`, `hammer`, `nsper` and `wintri` were on this list and are no longer
      forward-only -- see the expected_rows note, which names the upstream line for each.
      `rpoly` is still forward-only and left for a different reason, also in that note.)

      WHY THE KEYS ARE ENUMERATED RATHER THAN GLOBBED, AND WHY NO CRS CODE IS IN THE LIST. The gate
      that produces these errors (`BasicCoordinateTransform.inverseAvailable`) deliberately does NOT
      key on `hasInverse()`, because the implementing stream measured that doing so was wrong in
      both directions: `KrovakProjection` and `NewZealandMapGridProjection` implement
      `projectInverse` and never declare `hasInverse()`, so a `hasInverse()`-only gate rejected
      EPSG:2065, EPSG:5514 and EPSG:27200 -- three working CRS -- and `LandsatProjection` declares
      it while overriding nothing. The gate now interrogates the class hierarchy for a declared
      `projectInverse(double, double, ProjCoordinate)` instead. **EPSG:2065, EPSG:5514 and
      EPSG:27200 must never appear in this rule**, and an explicit 18-name list is the only scoping
      that makes that structurally impossible: `keys: ["proj/*"]` would have swallowed them the
      moment anything else about those rows moved. The same reasoning excludes `+proj=geocent`,
      which is invertible and declares so (see PROJ-GEOCENT-LON0-APPLIED and
      proj/GeocentProjection.java).

      Every claimed row's current side is all-NaN in the inverse columns by construction, so
      allow_nonfinite and allow_status_change are required and no magnitude band is meaningful. The
      75 rows whose baseline side carried a value are exactly the rows this rule says were wrong:
      the rule does not vouch for those baseline numbers, it records that they are gone.
    match:
      classifications: [CHANGED]
      sections: [SYN]
      keys: ["proj/airy", "proj/august", "proj/boggs", "proj/denoy",
             "proj/larr", "proj/lask", "proj/nicol",
             "proj/tcc", "proj/wag7",
             "proj/adams_hemi", "proj/adams_ws1", "proj/guyou"]
      status_to: "EXC:org.locationtech.proj4j.CrsTransformException"
    expect:
      dimensions: [fx, fy, fz, ix, iy, iz]
      allow_status_change: true
      allow_inside_change: true
      allow_nonfinite: true

