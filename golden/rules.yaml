    # because `-pl golden` alone resolves core from the local repository and silently compares the
    # wrong tree; the first attempt at this A/B did exactly that and reported no movement at all.
    #
    # WITHOUT the change: 11,996 UNCHANGED / 41,434 CHANGED / 39,147 INTENDED / 2,287 UNEXPLAINED
    # and no COUNT_MISMATCH -- i.e. exactly the figures pinned in
    # golden/baseline/1.4.3/golden-expect.txt. WITH it: 11,994 / 41,436 / 39,149 / 2,287. The delta
