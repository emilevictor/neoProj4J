name: Performance Gate

# TIERS 1 AND 2 OF THE PERFORMANCE REGRESSION GATE. TURNED OFF FOR NOW - IT RUNS ONLY WHEN A
# HUMAN ASKS FOR IT.
#
# Until this file existed, NO JOB ANYWHERE INVOKED GateChecker - the module is not in the root
# pom's default <modules> (deliberately: a plain build must neither compile it nor download JMH,
# so `core` stays dependency-free) and no workflow passed `-Pbench`. This file is what makes the
# gate runnable in CI at all. It ran on push and pull_request from 2026-08-01 until 2026-08-14;
# see the block below for why it no longer does.
#
# WHAT THE JOB DOES. Build the shaded benchmarks jar under `-Pbench`, run GateChecker's own
# self-test, then run `benchmark/run-gate.sh --quick --require-baseline`, which runs the JMH suite
# with the allocation profiler attached and checks two tiers against the committed baselines in
# benchmark/src/main/resources/baseline/. Finally, assert that the run measured something at all.
#
#   Tier 1 (allocation, bytes/op) against allocation-baseline.json: 25 rules and 170 ratchets.
#   `required: true` on a rule is load-bearing independently of any threshold - a benchmark that
#   was renamed or excluded fails the gate even where no number would have rejected it.
#
#   Tier 2 (deterministic transcendental call counts) against op-counts.json: 8 benchmark/op
#   pairs, none of them TBD.
#
# WHY `--require-baseline`. The flag turns a TBD threshold from a warning into a failure. Both
# baselines are captured and committed, and the only two TBD leaves left are a `targetBytesPerOp`
# on a rule whose `maxBytesPerOp` is a real number - `transform-cache-miss` and `crs-parse` - so
# the policy column is open while the ratchet column gates. The flag therefore has nothing left to
# reject, and the job is green because the thresholds are pinned rather than because the gate is
# quiet. A green job over unpinned thresholds measures nothing and reports success, which is the
# exact failure this workflow was added to end. Re-record after a deliberate change:
#
#     cd benchmark && ./run-gate.sh --record        # then commit both baseline JSON files
#
# RATCHET PORTABILITY IS STILL UNPROVEN, AND THE FIRST RUNNER EXECUTION IS ITS TEST. The committed
# capture was taken on Temurin 21 / aarch64; this job runs Temurin 21 / x86-64 / Linux.
# gc.alloc.rate.norm is a property of the bytecode and both platforms use compressed oops, so the
# numbers SHOULD be identical - but "should" is not evidence, and the gate's slack is deliberately
# tight (max(0.5 B, 0.1%)). If a run fails by small deltas on many arms, that is a portability
# finding, and the fix is to re-record on this architecture with a workflow_dispatch job - NOT to
# widen the slack and not to raise a ratchet.
#
# WHY NO TIER 3 (absolute ns/op). Deliberate, and argued at length in GateChecker's javadoc: JMH on
# shared CI runners varies +/-20-40% - no CPU pinning, no turbo control, noisy neighbours - and a
# gate with that false-positive rate gets muted, then ignored, then deleted. Timing belongs on a
# nightly job on dedicated hardware, alerting only on a >10% regression sustained across three
# consecutive nights. Do not add a timing assertion here.
#
# VERIFICATION STATUS. Every command in this job has been run to completion outside CI, through
# ./docker/run.sh bench, which mirrors them flag for flag: GATE PASSED, exit 0, 245 arms, 245
# gated and 0 EXCLUDED. GateChecker's Tier 1 comparison has also been shown to reject: a fixture
# with an injected 62.4 B/op on MathDispatchBenchmark.math produced "ALLOCATION REGRESSION ...
# delta +62.4 B/op" naming the benchmark and the rule, while the otherwise-identical clean fixture
# did not. The YAML itself has never executed on a runner; treat the first run as its first test.

# ============================================================================================
# TURNED OFF, 2026-08-14. Temporary, and deliberate. Recorded here rather than hidden.
#
# The job is green and the gate works. It was taken off push and pull_request because it costs
# about 21 minutes of measurement on every commit, and nobody is willing to wait on it. There is
# no schedule either: this workflow now runs ONLY when someone starts it by hand.
#
# What was NOT done, and why:
#   - `continue-on-error`: it would report success while seeing nothing. Removing a trigger makes
#     the gate absent, which is honest. Softening the job makes it lie. Do not add it.
#   - loosening the saved numbers in benchmark/src/main/resources/baseline/ to make the job
#     cheaper: it would not make it faster, and it would weaken the only measurement of how much
#     memory the library allocates per operation.
#
# WHAT THIS COSTS, STATED PLAINLY, BECAUSE IT IS NOT SMALL. Nothing automatic runs this any more.
# An increase in memory allocated per operation - a reintroduced output array, a boxed cache key,
# a lost fast path - and a change in the number of sin/cos/log calls a transform makes will BOTH
# go unnoticed until a human asks for a run. Not on the next commit, not overnight, not next week.
# The only remaining cover is somebody running it: `./docker/run.sh bench` locally, which
# HOWTORELEASE.txt's release checklist calls for, or a manual run of this workflow.
#
# Run it by hand:  gh workflow run bench.yaml
# or the Actions tab -> Performance Gate -> "Run workflow".
#
# TO TURN IT BACK ON: restore `push: branches: [master, main]` and `pull_request:` below, and put
# the word "blocking" back in the job name in the SAME COMMIT. If it is coming back only as a
# periodic run, add a `schedule:` instead and rename the job to match. golden.yaml carries the
# same rule about the name.
# ============================================================================================
on:
  workflow_dispatch:

# KEPT, AND THE REASONING CHANGED WITH THE TRIGGERS. `cancel-in-progress` was earning its keep on
# pull requests: a second commit superseded the first and there was no point measuring the old one.
# With `workflow_dispatch` only, two runs can share a group only when both were started by hand on
# the same ref. In that case the later run measures the same branch at the same or a newer commit,
# so it supersedes the earlier one and cancelling is still the right answer; the alternative is two
# 21-minute JMH runs producing one useful number. A run started on some other ref lands in a
# different group and is unaffected. Same block, same values, as golden.yaml.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # NOT A PR OR PUSH CHECK, AND NOT A PERIODIC ONE EITHER - it cannot block a merge, because
  # nothing here triggers on one; see the block above. Within its own run it is uncompromising:
  # build the shaded benchmarks jar, run the live benchmarks with the allocation profiler, then
  # check Tiers 1 and 2 and fail on any breach. There is no `continue-on-error` and there must not
  # be one.
  #
  # The `name:` below deliberately does not say "blocking", because the triggers do not make it so.
  # PUT THE WORD BACK IN THE SAME COMMIT that restores a push or pull_request trigger, and take it
  # out again in the same commit that removes one. golden.yaml carries the same instruction.
  gate:
    name: Allocation and op-count gate (manual only)
    runs-on: ubuntu-latest
    # A full JMH run of this module is roughly 90 minutes; --quick drops to 1 fork and 2+3
    # one-second iterations and has been measured at about 21 minutes in the project's Docker
    # container (Temurin 21 / aarch64, 245 arms). Nobody has timed it on a runner, so the budget is
    # generous rather than tuned; tighten it once there is a number from a real run.
    timeout-minutes: 60
    steps:
      # fetch-depth: 0, not the default 1: the jgitver Maven extension derives the project
      # version by walking back to the nearest tag. A depth-1 clone with no tags gives it
      # nothing to find and every module builds as 0.0.0-SNAPSHOT. fetch-tags: true is NOT a
      # substitute - it brings the tag objects but not the ancestry jgitver walks to reach them.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          # benchmark/pom.xml compiles at <release>17</release>, deliberately newer than core's 8,
          # because this module is never published. 21 is what the baselines are captured on.
          java-version: '21'

      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-bench-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-bench-
            ${{ runner.os }}-maven-

      # -Pbench is what adds <module>benchmark</module> to the root pom; -pl benchmark alone
      # cannot resolve it. -am brings neoproj4j, neoproj4j-epsg and neoproj4j-grids-us-legacy, all three of
      # which must be inside the shaded jar - grids-us-legacy is not optional, see the long note in
      # benchmark/pom.xml about NAD27_TO_NAD83 silently degrading to a near-identity without it.
      #
      # -DskipTests: benchmark/pom.xml already sets skipTests, but -am builds core, and running
      # core's whole suite here would add minutes to a job that is about allocation counts. core's
      # tests are ci.yaml's business, not this job's.
      - name: Build the shaded benchmarks jar
        run: |
          mvn -B -ntp -Pbench -pl benchmark -am package \
            -DskipTests \
            -Dmaven.javadoc.skip=true \
            -Dmaven.source.skip=true

      # The gate's own plumbing, before it is trusted to judge anything else. Cheap, and it is the
      # difference between "the gate passed" and "the gate ran".
      # NB: a literal block scalar, not a plain one with a backslash. YAML folds a plain multi-line
      # scalar's newline into a space, so `... \<newline>   org...` reaches the shell as
      # `... \ org...` - a backslash-escaped SPACE, not a line continuation - and the command dies
      # on an unparseable argument. Every other multi-line `run:` in this repository's workflows
      # uses `run: |` for the same reason.
      - name: GateChecker self-test
        run: |
          java -cp benchmark/target/benchmarks.jar \
            org.locationtech.proj4j.benchmark.gate.GateChecker --self-test

      # run-gate.sh rather than an inline command, on purpose: the JMH exclusion, the profiler and
      # the output format are all load-bearing and would drift if duplicated here.
      #   -prof gc         produces gc.alloc.rate.norm. WITHOUT IT TIER 1 SILENTLY CHECKS NOTHING.
      #   (there is no -e any more. It used to exclude ...benchmark.staged, whose @Setup failed
      #    because the bulk API did not exist. It does now, the staged package is deleted, and
      #    BulkTransformBenchmark is gated like everything else - which it was NOT while excluded:
      #    the bulk-zero-allocation rule matched nothing for the whole of that period.)
      #   --quick          1 fork, 2 warmup + 3 measurement iterations at 1 s. Legitimate for
      #                    Tier 1 because bytes/op is a bytecode property that converges
      #                    immediately; it would NOT be legitimate for timing, which is why this
      #                    job does not do timing.
      #   --require-baseline  a TBD threshold is a failure. See the header.
      - name: Run the gate
        run: |
          cd benchmark
          ./run-gate.sh --quick --require-baseline

      # NON-VACUITY. `-prof gc` failing to attach, or a JMH exclusion accidentally matching
      # everything, both produce a run in which Tier 1 examines zero measurements - and the tier
      # would then have nothing to complain about. Runs even on failure, because a gate that
      # failed for the wrong reason still has to be caught.
      #
      # awk and shell arithmetic, never `bc`: bc is not guaranteed present on every runner image,
      # and a gate that dies on a missing utility is indistinguishable from a gate that fails.
      - name: Assert the run actually measured something
        if: always()
        run: |
          set -euo pipefail
          json=benchmark/target/jmh-result.json
          [ -f "$json" ] || {
            echo "::error::no $json - JMH did not produce a result file, so Tier 1 examined nothing."
            exit 1; }

          # One line per benchmark record. grep -c on the key, not a JSON parser: jq is present on
          # GitHub runners today but this check must not acquire a dependency to stay true.
          arms=$(grep -c '"benchmark"' "$json" || true)
          alloc=$(grep -c 'gc.alloc.rate.norm' "$json" || true)
          echo "JMH arms: $arms   arms carrying gc.alloc.rate.norm: $alloc"
          # 200 against 245 measured arms across 10 classes. Both floors were 20, which a single
          # surviving class satisfied. 45 arms of headroom, because the arm count is a product of
          # @Param combinations and moves in jumps (this suite went 181 -> 245 in one change).
          # MIRRORED at docker/run.sh; the two must move together.
          [ "${arms:-0}" -ge 200 ] || {
            echo "::error::only ${arms:-0} benchmark arms in the result; expected at least 200."
            echo "::error::Benchmarks were excluded, renamed, or failed in @Setup. Tier 1 cannot"
            echo "::error::gate what was not run - and GateChecker's `required` flag only catches"
            echo "::error::the rules that expect a specific one."
            exit 1; }
          [ "${alloc:-0}" -ge 200 ] || {
            echo "::error::${alloc:-0} arms carry gc.alloc.rate.norm. The -prof gc profiler did not"
            echo "::error::attach. Tier 1 warns per benchmark in that case rather than failing, so"
            echo "::error::the whole tier would have measured NOTHING while reporting success."
            exit 1; }
          echo "Non-vacuity satisfied: $alloc of $arms arms carry an allocation measurement."

      - name: Upload the JMH result and gate output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-gate
          path: |
            benchmark/target/jmh-result.json
            benchmark/src/main/resources/baseline/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Remove neoproj4j artifacts from cache
        if: always()
        run: rm -rf "$HOME/.m2/repository/io/github/emilevictor/neoproj4j"
